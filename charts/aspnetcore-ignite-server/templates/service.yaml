apiVersion: v1
kind: Service
metadata:
  name: {{ include "aspnetcore-ignite-server.fullname" . }}
  labels:
    {{- include "aspnetcore-ignite-server.labels" . | nindent 4 }}
  {{- with (include "aspnetcore-ignite-server.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    # The discovery and communication ports are exposed on the headless Service only
    - name: thin-clients
      port: {{ .Values.service.ports.thinClients }}
      targetPort: {{ .Values.container.ports.thinClients }}
    - name: management
      port: {{ .Values.service.ports.management }}
      targetPort: {{ .Values.container.ports.management }}
    {{- if .Values.rest.enabled }}
    - name: rest
      port: {{ .Values.service.ports.rest }}
      targetPort: {{ .Values.container.ports.rest }}
    - name: rest-tcp
      port: {{ .Values.service.ports.restTcp }}
      targetPort: {{ .Values.container.ports.restTcp }}
    {{- end }}
  selector:
    {{- include "aspnetcore-ignite-server.selectorLabels" . | nindent 4 }}
  sessionAffinity: None
