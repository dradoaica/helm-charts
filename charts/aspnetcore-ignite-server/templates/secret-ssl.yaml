{{- if and (or .Values.ssl.enabled .Values.ssl.clientConnector.enabled) (not .Values.ssl.existingSecret.name) (ne false .Values.ssl.manageSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aspnetcore-ignite-server.fullname" . }}-ssl
  labels:
    {{- include "aspnetcore-ignite-server.labels" . | nindent 4 }}
  {{- with (include "aspnetcore-ignite-server.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  ignite-ssl-ks-pass: {{ .Values.ssl.keyStorePassword | b64enc | quote }}
  ignite-ssl-ts-pass: {{ .Values.ssl.trustStorePassword | b64enc | quote }}
  ignite-ssl-client-cert-pass: {{ .Values.ssl.clientConnector.clientCertificatePassword | b64enc | quote }}
{{- end }}
