{{- if .Values.networkPolicy.create }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ default (include "aspnetcore-ignite-server.fullname" .) .Values.networkPolicy.name }}
  labels:
    {{- include "aspnetcore-ignite-server.labels" . | nindent 4 }}
  {{- with (include "aspnetcore-ignite-server.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "aspnetcore-ignite-server.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if .Values.networkPolicy.allowIntraCluster }}
    # Allow traffic between the pods of this release (e.g., node-to-node communication, init/activation job, tests)
    - from:
        - podSelector:
            matchLabels: {{- include "aspnetcore-ignite-server.selectorLabels" . | nindent 14 }}
    {{- end }}
    {{- with .Values.networkPolicy.ingress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    {{- if .Values.networkPolicy.allowIntraCluster }}
    # Allow traffic between the pods of this release (e.g., node-to-node communication, init/activation job, tests)
    - to:
        - podSelector:
            matchLabels: {{- include "aspnetcore-ignite-server.selectorLabels" . | nindent 14 }}
    {{- end }}
    {{- with .Values.networkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}

