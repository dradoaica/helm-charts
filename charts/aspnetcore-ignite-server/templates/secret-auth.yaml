{{- if and .Values.authentication.enabled (not .Values.authentication.existingSecret.name) (ne false .Values.authentication.manageSecret) (or .Values.authentication.igniteUserPassword .Values.authentication.igniteUserPreviousPassword) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aspnetcore-ignite-server.fullname" . }}-auth
  labels:
    {{- include "aspnetcore-ignite-server.labels" . | nindent 4 }}
  {{- with (include "aspnetcore-ignite-server.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  ignite-user-password: {{ .Values.authentication.igniteUserPassword | b64enc | quote }}
  {{- with .Values.authentication.igniteUserPreviousPassword }}
  ignite-user-previous-password: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
