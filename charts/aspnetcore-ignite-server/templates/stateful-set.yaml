{{- /* The server refuses to start without the client certificate of its own loopback client (password change) */}}
{{- $fromStoresSecret := not (empty .Values.ssl.storesSecret.name) }}
{{- with .Values.ssl.clientConnector }}
{{- if and .enabled .clientAuth (not (ternary $.Values.ssl.storesSecret.clientCertificateKey .clientCertificatePath $fromStoresSecret)) }}
{{- fail (printf "ssl.clientConnector.clientAuth requires the client certificate (PKCS12) of the server's own client: set %s, or ssl.clientConnector.clientAuth=false" (ternary "ssl.storesSecret.clientCertificateKey (e.g., keystore.p12)" "ssl.clientConnector.clientCertificatePath" $fromStoresSecret)) }}
{{- end }}
{{- end }}
{{- /* Kubernetes kills a pod still stopping after its grace period: the node would not stop cleanly */}}
{{- $shutdownTimeout := int (default 30 .Values.env.SHUTDOWN_TIMEOUT_IN_SECONDS) }}
{{- if le (int .Values.terminationGracePeriodSeconds) $shutdownTimeout }}
{{- fail (printf "terminationGracePeriodSeconds (%d) must be above env.SHUTDOWN_TIMEOUT_IN_SECONDS (%d), the time the server may take to stop" (int .Values.terminationGracePeriodSeconds) $shutdownTimeout) }}
{{- end }}
{{- /* Nodes of different Ignite minor versions cannot form one cluster (2.19 nodes do not even recognize 2.18 ones), so
  replacing the running pods one by one would start a second cluster beside the first */}}
{{- $statefulSet := lookup "apps/v1" "StatefulSet" .Release.Namespace (printf "%s-cluster" (include "aspnetcore-ignite-server.fullname" .)) }}
{{- if $statefulSet }}
{{- if gt (int $statefulSet.spec.replicas) 0 }}
{{- $target := regexFind "^[0-9]+\\.[0-9]+" (include "aspnetcore-ignite-server.igniteVersion" .) }}
{{- $running := regexFind "^[0-9]+\\.[0-9]+" (get (default (dict) $statefulSet.metadata.annotations) "ignite.apache.org/version") }}
{{- if not $running }}
{{- /* A release of chart 2.18.x (its server versions follow the Ignite ones) */}}
{{- range $statefulSet.spec.template.spec.containers }}
{{- if eq .name "ignite-node" }}
{{- $running = regexFind "^[0-9]+\\.[0-9]+" (last (splitList ":" .image)) }}
{{- end }}
{{- end }}
{{- end }}
{{- if and $running $target (ne $running $target) }}
{{- fail (printf "The cluster runs Ignite %s, whose nodes cannot form a cluster with Ignite %s nodes. Stop it first (deactivate it with control.sh --set-state INACTIVE when persistent, then scale the StatefulSet %s to 0) and upgrade again" $running $target $statefulSet.metadata.name) }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "aspnetcore-ignite-server.fullname" . }}-cluster
  labels:
    {{- include "aspnetcore-ignite-server.labels" . | nindent 4 }}
  annotations:
    # Read by the next upgrade (see above)
    ignite.apache.org/version: {{ include "aspnetcore-ignite-server.igniteVersion" . | quote }}
    {{- with (include "aspnetcore-ignite-server.annotations" .) }}
    {{- . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "aspnetcore-ignite-server.selectorLabels" . | nindent 6 }}
  serviceName: {{ include "aspnetcore-ignite-server.fullname" . }}-svc-headless
  replicas: {{ .Values.replicaCount }}
  {{- if .Values.podManagementPolicy }}
  podManagementPolicy: {{ .Values.podManagementPolicy }}
  {{- end }}
  {{- if not (has (toString .Values.revisionHistoryLimit) (list "" "<nil>")) }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  {{- end }}
  {{- if .Values.updateStrategy }}
  updateStrategy:
    type: {{ .Values.updateStrategy.type }}
    {{- if .Values.updateStrategy.rollingUpdate }}
    rollingUpdate: {{- toYaml .Values.updateStrategy.rollingUpdate | nindent 6 }}
    {{- end }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "aspnetcore-ignite-server.podLabels" . | nindent 8 }}
      annotations:
        # Rollout on secret reference changes
        creds/aspnetcore-ignite-server-auth: {{ (default (printf "%s-auth" (include "aspnetcore-ignite-server.fullname" .)) .Values.authentication.existingSecret.name) | quote }}
        creds/aspnetcore-ignite-server-ssl: {{ (default (printf "%s-ssl" (include "aspnetcore-ignite-server.fullname" .)) .Values.ssl.existingSecret.name) | quote }}
        checksum/secrets: {{ print (include (print $.Template.BasePath "/secret-auth.yaml") .) (include (print $.Template.BasePath "/secret-ssl.yaml") .) | sha256sum }}
        checksum/config: {{ include (print $.Template.BasePath "/config-map.yaml") . | sha256sum }}
        {{- if .Values.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.container.ports.management | quote }}
        prometheus.io/path: /metrics
        {{- end }}
      {{- with (include "aspnetcore-ignite-server.podAnnotations" .) }}
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      serviceAccountName: {{ include "aspnetcore-ignite-server.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.podSecurityContext.enabled }}
      securityContext:
        {{- toYaml (omit .Values.podSecurityContext "enabled") | nindent 8 }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName | quote }}
      {{- end }}
      {{- if .Values.extraInitContainers }}
      initContainers:
        {{- toYaml .Values.extraInitContainers | nindent 8 }}
      {{- end }}
      containers:
        {{- if .Values.extraContainers }}
        {{- toYaml .Values.extraContainers | nindent 8 }}
        {{- end }}
        - name: ignite-node
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            # Must be specified to ensure that Ignite cluster replicas are visible to each other.
            - name: DEFAULT_CONSISTENT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_NAMESPACE
              value: "{{ .Release.Namespace }}"
            - name: K8S_SERVICE_NAME
              value: "{{ include "aspnetcore-ignite-server.fullname" . }}-svc-headless"
            - name: USE_TCP_DISCOVERY_STATIC_IP_FINDER
              value: 'false'
            # Required in an existing Secret: without it, the ignite user would silently keep its default password
            - name: IGNITE_USER_PASSWORD
              {{- include "aspnetcore-ignite-server.secretKeyRef" (dict "existing" .Values.authentication.existingSecret.name "key" .Values.authentication.existingSecret.key "default" "ignite-user-password" "suffix" "auth" "required" (and .Values.authentication.enabled .Values.authentication.existingSecret.name) "context" $) | nindent 14 }}
            - name: IGNITE_USER_PREVIOUS_PASSWORD
              {{- include "aspnetcore-ignite-server.secretKeyRef" (dict "existing" .Values.authentication.existingSecret.name "key" .Values.authentication.existingSecret.previousKey "default" "ignite-user-previous-password" "suffix" "auth" "context" $) | nindent 14 }}
            - name: SSL_KEY_STORE_PASSWORD
              {{- include "aspnetcore-ignite-server.secretKeyRef" (dict "existing" .Values.ssl.existingSecret.name "key" .Values.ssl.existingSecret.keys.ksPass "default" "ignite-ssl-ks-pass" "suffix" "ssl" "context" $) | nindent 14 }}
            - name: SSL_TRUST_STORE_PASSWORD
              {{- include "aspnetcore-ignite-server.secretKeyRef" (dict "existing" .Values.ssl.existingSecret.name "key" .Values.ssl.existingSecret.keys.tsPass "default" "ignite-ssl-ts-pass" "suffix" "ssl" "context" $) | nindent 14 }}
            - name: SSL_CLIENT_CERTIFICATE_PASSWORD
              {{- include "aspnetcore-ignite-server.secretKeyRef" (dict "existing" .Values.ssl.existingSecret.name "key" .Values.ssl.existingSecret.keys.clientCertPass "default" "ignite-ssl-client-cert-pass" "suffix" "ssl" "context" $) | nindent 14 }}
            {{- $derivedEnv := include "aspnetcore-ignite-server.derivedEnv" . | fromYaml }}
            {{- range $name, $value := $derivedEnv }}
            - name: {{ $name | quote }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range $name, $value := .Values.env }}
            {{- if hasKey $derivedEnv $name }}
            {{- if and (ne (toString $value) "") (ne (toString $value) (toString (get $derivedEnv $name))) }}
            {{- fail (printf "env.%s is set by the chart from its values, so remove it from env" $name) }}
            {{- end }}
            {{- else }}
            - name: {{ $name | quote }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.extraEnvVars }}
            {{- toYaml .Values.extraEnvVars | nindent 12 }}
            {{- end }}
          {{- if or .Values.extraEnvFrom .Values.extraEnvVarsCM .Values.extraEnvVarsSecret }}
          envFrom:
            {{- if .Values.extraEnvFrom }}
            {{- toYaml .Values.extraEnvFrom | nindent 12 }}
            {{- end }}
            {{- if .Values.extraEnvVarsCM }}
            - configMapRef:
                name: {{ .Values.extraEnvVarsCM }}
            {{- end }}
            {{- if .Values.extraEnvVarsSecret }}
            - secretRef:
                name: {{ .Values.extraEnvVarsSecret }}
            {{- end }}
          {{- end }}
          image: {{ include "aspnetcore-ignite-server.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.containerSecurityContext.enabled }}
          securityContext:
            {{- toYaml (omit .Values.containerSecurityContext "enabled") | nindent 12 }}
          {{- end }}
          ports:
            - name: thin-clients
              containerPort: {{ .Values.container.ports.thinClients }}
              protocol: TCP
            - name: spi-comm
              containerPort: {{ .Values.container.ports.spiCommunication }}
              protocol: TCP
            - name: spi-discovery
              containerPort: {{ .Values.container.ports.spiDiscovery }}
              protocol: TCP
            - name: management
              containerPort: {{ .Values.container.ports.management }}
              protocol: TCP
            {{- if .Values.rest.enabled }}
            - name: rest
              containerPort: {{ .Values.container.ports.rest }}
              protocol: TCP
            - name: rest-tcp
              containerPort: {{ .Values.container.ports.restTcp }}
              protocol: TCP
            {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe: {{- include "common.tplvalues.render" (dict "value" (omit .Values.startupProbe "enabled") "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe: {{- include "common.tplvalues.render" (dict "value" (omit .Values.livenessProbe "enabled") "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe: {{- include "common.tplvalues.render" (dict "value" (omit .Values.readinessProbe "enabled") "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.lifecycleHooks }}
          lifecycle: {{- include "common.tplvalues.render" (dict "value" .Values.lifecycleHooks "context" $) | nindent 12 }}
          {{- end }}
          volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: /app/config-extra
              name: config-extra
              readOnly: true
            - mountPath: /app/work
              name: {{ ternary .Values.persistence.storageVolume.claimName "work" .Values.persistence.enabled }}
            {{- if and .Values.persistence.enabled .Values.persistence.walVolume.enabled }}
            - mountPath: /wal
              name: {{ .Values.persistence.walVolume.claimName }}
            {{- end }}
            {{- if .Values.ssl.storesSecret.name }}
            - mountPath: /certs
              name: certs
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: { }
        - name: config-extra
          configMap:
            name: {{ include "aspnetcore-ignite-server.fullname" . }}
        {{- if not .Values.persistence.enabled }}
        - name: work
          emptyDir: { }
        {{- end }}
        {{- if .Values.ssl.storesSecret.name }}
        - name: certs
          secret:
            secretName: {{ .Values.ssl.storesSecret.name }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: {{ .Values.persistence.storageVolume.claimName }}
        {{- if .Values.persistence.storageVolume.labels }}
        labels:
          {{- toYaml .Values.persistence.storageVolume.labels | nindent 10 }}
        {{- end }}
        {{- if .Values.persistence.storageVolume.annotations }}
        annotations:
          {{- toYaml .Values.persistence.storageVolume.annotations | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.storageVolume.accessModes | nindent 10 }}
        {{- if .Values.persistence.storageVolume.storageClass }}
        storageClassName: {{ .Values.persistence.storageVolume.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.storageVolume.size }}
    {{- if .Values.persistence.walVolume.enabled }}
    - metadata:
        name: {{ .Values.persistence.walVolume.claimName }}
        {{- if .Values.persistence.walVolume.labels }}
        labels:
          {{- toYaml .Values.persistence.walVolume.labels | nindent 10 }}
        {{- end }}
        {{- if .Values.persistence.walVolume.annotations }}
        annotations:
          {{- toYaml .Values.persistence.walVolume.annotations | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.walVolume.accessModes | nindent 10 }}
        {{- if .Values.persistence.walVolume.storageClass }}
        storageClassName: {{ .Values.persistence.walVolume.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.walVolume.size }}
    {{- end }}
  {{- if .Values.persistence.persistentVolumeClaimRetentionPolicy.enabled }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: {{ .Values.persistence.persistentVolumeClaimRetentionPolicy.whenDeleted }}
    whenScaled: {{ .Values.persistence.persistentVolumeClaimRetentionPolicy.whenScaled }}
  {{- end }}
  {{- end }}
