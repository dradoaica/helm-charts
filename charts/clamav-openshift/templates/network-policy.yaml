{{- if .Values.networkPolicy.create }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.networkPolicy.name | default (include "clamav-openshift.fullname" .) }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "clamav-openshift.labels" . | nindent 4 }}
  {{- with (include "clamav-openshift.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  egress:
    {{- with .Values.networkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  ingress:
    {{- if .Values.networkPolicy.allowTests }}
    # Allow traffic from the chart's test pods (helm test)
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "clamav-openshift.name" . }}-test
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: {{ .Values.container.ports.clamd }}
          protocol: TCP
    {{- end }}
    {{- with .Values.networkPolicy.ingress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  podSelector:
    matchLabels: {{- include "clamav-openshift.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
{{- end }}
