{{- if include "clamav-openshift.createSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "clamav-openshift.fullname" . }}
  labels:
    {{- include "clamav-openshift.labels" . | nindent 4 }}
  {{- with (include "clamav-openshift.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  http-proxy-password: {{ .Values.freshclam.httpProxyPassword | b64enc | quote }}
{{- end }}
