# Upgrading from 2.18.3: see the Upgrading section of README.md

global:
  # -- Global container image registry override
  imageRegistry: ""
  # -- Global pod image pull secrets
  imagePullSecrets: [ ]

# -- String to partially override the fullname template with a string (will prepend the release name)
nameOverride: ""
# -- String to fully override the fullname template with a string
fullnameOverride: ""

# -- Additional labels to add to all resources
labels: { }
# -- Additional labels to add to pods
podLabels: { }

# -- Annotations to add to all resources
annotations: { }
# -- Additional annotations to add to pods
podAnnotations: { }

# -- Extra init containers to inject into the main Pod spec
extraInitContainers: [ ]
# -- Extra sidecar containers to inject into the main Pod spec
extraContainers: [ ]
# -- Extra volumes to add to the main Pod spec
extraVolumes: [ ]
# -- Extra volume mounts to add to the main container
extraVolumeMounts: [ ]
# -- Extra environment variables to inject into the main container
extraEnvVars: [ ]
# -- Extra envFrom entries to inject into the main container
extraEnvFrom: [ ]
# -- Name of a ConfigMap with extra environment variables to inject into the main container
extraEnvVarsCM: ""
# -- Name of a Secret with extra environment variables to inject into the main container
extraEnvVarsSecret: ""

image:
  # -- Main container image registry
  registry: docker.io
  # -- Main container image repository
  repository: apacheignite/ignite
  # -- Main container image tag (defaults to appVersion when empty; each architecture has its own tag, e.g., 2.18.0-arm64)
  tag: ""
  # -- Main container image pull policy
  pullPolicy: IfNotPresent

serviceAccount:
  # -- Create a dedicated ServiceAccount
  create: true
  # -- Name for the ServiceAccount (autogenerated when empty)
  name: ""
  # -- Additional annotations to add to ServiceAccount
  annotations: { }

rbac:
  # -- Create RBAC items (e.g., role, role-binding)
  create: true

# -- StatefulSet pod management policy
podManagementPolicy: OrderedReady
# -- Number of old ReplicaSets to retain
revisionHistoryLimit: 10

# -- StatefulSet update strategy (nodes of different Ignite minor versions cannot form one cluster; before moving to
# another minor version, e.g., from 2.18 to 2.19, deactivate the cluster and scale the StatefulSet to 0)
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    partition: 0

# -- Seconds a started pod must stay ready before the next one starts or restarts (Ignite's readiness probe does not wait
# for rebalancing; raise it for large data sets)
minReadySeconds: 60

# -- Pod priority class name
priorityClassName: ""

# -- Pod termination grace period
terminationGracePeriodSeconds: 60

# -- Pod security context configuration
podSecurityContext:
  # -- Enable pod security context
  enabled: true
  runAsUser: 1001
  runAsGroup: 1001
  runAsNonRoot: true
  fsGroup: 1001

# -- Container security context configuration
containerSecurityContext:
  # -- Enable container security context
  enabled: true
  runAsUser: 1001
  runAsGroup: 1001
  runAsNonRoot: true
  privileged: false
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ "ALL" ]
  seccompProfile:
    type: RuntimeDefault

# -- Main container requests/limits with guaranteed QoS (requests = limits)
#  memory calculation: onHeapMB (JVM Heap max size)
#   + maxMetaspaceSizeMB (JVM Metaspace max size)
#   + reservedCodeCacheSizeMB (JVM ReservedCodeCache size)
#   + offHeapMB (default region max size; data + indexes (basic use cases will add a 30% increase on top of data))
#   + MIN(256MB, offHeapMB) (offHeapMB < 1 GB)
#     || offHeapMB/4 (offHeapMB between 1 GB and 8 GB)
#     || 2GB (offHeapMB > 8 GB)
#       (default region checkpointing buffer size)
#   + 100MB (sysMemPlc region max size)
#   + 100MB (metastoreMemPlc region max size)
#   + 100MB (TxLog region max size)
#   + 100MB (volatileDsMemPlc region max size)
#   + ~512MB (other overheads; e.g., thread stacks, GC, symbols, etc.)
resources:
  requests:
    cpu: "2"
    memory: 5Gi
  limits:
    cpu: "2"
    memory: 5Gi

# -- Liveness probe configuration
livenessProbe:
  # -- Enable liveness probe
  enabled: true
  httpGet:
    path: /ignite?cmd=version
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3
  successThreshold: 1

# -- Readiness probe configuration
readinessProbe:
  # -- Enable readiness probe
  enabled: true
  httpGet:
    path: /ignite?cmd=probe
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 3
  successThreshold: 1

# -- Startup probe configuration
startupProbe:
  # -- Enable startup probe
  enabled: true
  httpGet:
    path: /ignite?cmd=version
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 15
  successThreshold: 1

# -- Lifecycle hooks configuration
lifecycleHooks: { }

container:
  # -- Container ports used by the Pod spec and as Service targetPort values
  ports:
    # -- TCP binary protocol of the REST connector (e.g., the legacy JDBC driver)
    jdbc: 11211
    spiCommunication: 47100
    spiDiscovery: 47500
    # -- Thin clients, JDBC, ODBC and the control utility (client connector)
    sql: 10800
    # -- REST API (unencrypted)
    rest: 8080
    # -- Prometheus metrics (only with metrics.enabled)
    metrics: 9464

service:
  # -- Service ports used by the Service spec. targetPort fields reference container.ports.* (spiCommunication and
  # spiDiscovery are on the headless Service only)
  ports:
    jdbc: 11211
    spiCommunication: 47100
    spiDiscovery: 47500
    sql: 10800
    rest: 8080
    metrics: 9464

persistence:
  # -- Enable persistent settings - both storage and WAL (the work directory, with the binary metadata, marshaller
  # mappings and snapshots, is kept in the storage volume at /storage/work)
  enabled: true
  persistentVolumeClaimRetentionPolicy:
    # -- Enable persistent volume retention policy
    enabled: false
    # -- Volume retention behavior when the replica count of the StatefulSet is reduced
    whenScaled: Retain
    # -- Volume retention behavior that applies when the StatefulSet is deleted
    whenDeleted: Retain
  # -- Volume where data and indexes are to be persisted
  storageVolume:
    # -- Persistent volume size for storage
    size: 8Gi
    # -- Persistent volume storage class for storage (empty string uses cluster default)
    storageClass: ""
    # -- Persistent volume access modes
    accessModes:
      - ReadWriteOnce
    # -- Labels to add to the storage PersistentVolumeClaim
    labels: { }
    # -- Annotations to add to the storage PersistentVolumeClaim
    annotations: { }
  # -- Volume where WAL is persisted
  walVolume:
    # -- Persistent volume size for WAL
    size: 8Gi
    # -- Persistent volume storage class for WAL (empty string uses cluster default)
    storageClass: ""
    # -- Persistent volume access modes
    accessModes:
      - ReadWriteOnce
    # -- Labels to add to the WAL PersistentVolumeClaim
    labels: { }
    # -- Annotations to add to the WAL PersistentVolumeClaim
    annotations: { }

# -- Node selector
nodeSelector: { }
# -- Node tolerations
tolerations: [ ]
# -- Node affinity
affinity: { }
# -- Topology spread constraints (templated; by default, the pods prefer different Kubernetes nodes, so that a node
# failure takes as few copies of the same partitions as possible)
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: '{{ include "ignite.name" . }}'
        app.kubernetes.io/instance: '{{ .Release.Name }}'

networkPolicy:
  # -- Create a NetworkPolicy
  create: false
  # -- Name for the NetworkPolicy (defaults to fullname when empty)
  name: ""
  # -- Allow ingress/egress traffic between the pods of this release (required for cluster communication)
  allowIntraCluster: true
  # -- NetworkPolicy ingress rules (add rules for clients that need access to the cluster)
  ingress: [ ]
  # -- NetworkPolicy egress rules
  egress:
    # Allow DNS resolution
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow access to the Kubernetes API server (required by the Kubernetes IP finder for discovery)
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP

podDisruptionBudget:
  # -- Create a PodDisruptionBudget (only with more than one replica)
  create: true
  # -- Minimum number of pods that must be available during disruptions (mutually exclusive with maxUnavailable)
  minAvailable: ""
  # -- Maximum number of pods that can be unavailable during disruptions (mutually exclusive with minAvailable)
  maxUnavailable: 1

# Autoscaling is NOT recommended for Ignite clusters:
#  - With persistence, baseline auto-adjust is disabled by default; new pods join but hold no data
#    until they are added to the baseline topology (e.g., `control.sh --baseline add`).
#  - Scaling down removes nodes without draining them; partitions without backups (the default is 0 backups)
#    become lost or unavailable. Without persistence, every scale event triggers rebalancing.
#  - Every `helm upgrade` resets the StatefulSet replicas to `replicaCount`, overriding the HPA (an implicit scale-down).
#  - Memory-based scaling does not fit the JVM (heap is pre-touched and rarely returned), so pods rarely scale back down.
# Prefer scaling manually via `replicaCount`, one node at a time, and only with backups/replicas configured.
autoscaling:
  # -- Create a HorizontalPodAutoscaler (not recommended; scaling down can lose data, and new pods hold no data until added to the baseline topology - see the values.yaml comments)
  create: false
  # -- Minimum number of replicas
  minReplicas: 1
  # -- Maximum number of replicas
  maxReplicas: 10
  # -- Target CPU utilization percentage
  targetCPUUtilizationPercentage: 80
  # -- Target memory utilization percentage
  targetMemoryUtilizationPercentage: 80

ingress:
  # -- Create an Ingress for external HTTP access to REST API
  create: false
  # -- IngressClass that will be used to implement the Ingress
  className: ""
  # -- Additional annotations for the Ingress
  annotations: { }
  # -- List of Ingress hosts with path configuration
  hosts:
    - host: ignite.local
      paths:
        - path: /
          pathType: Prefix
          port: 8080
  # -- TLS configuration for Ingress
  tls: [ ]

# App specific
# -- Number of pods
replicaCount: 1

memory:
  # -- On-heap memory limit in MB. If set, -Xms and -Xmx will be value. If not set, defaults to 1024
  onHeapMB: ""
  # -- JVM Metaspace max size in MB. If not set, defaults to 256
  maxMetaspaceSizeMB: ""
  # -- JVM ReservedCodeCache size in MB. If not set, defaults to 240
  reservedCodeCacheSizeMB: ""
  # -- JVM G1 Heap region size in MB. If not set, defaults to 1
  g1HeapRegionSizeMB: ""
  # -- Off-heap memory limit in MB. Configures the maxSize for org.apache.ignite.configuration.DataStorageConfiguration bean (data + indexes)
  offHeapMB: 2048
  # -- JVM DirectMemory max size in MB (offHeapMB + checkpointing buffer size + other system regions total size)
  maxDirectMemorySizeMB: 2960

# -- Extra beans (e.g., com.mysql.cj.jdbc.MysqlDataSource)
extraBeans: |-

authentication:
  # -- Enable authentication (requires persistence.enabled, as Ignite keeps the users in its persistent metastorage)
  enabled: true
  # -- Password for the ignite user, set by the activation job (defaults to ignite when empty)
  igniteUserPassword: ""
  # -- Current password of the ignite user, when rotating it to igniteUserPassword
  igniteUserPreviousPassword: ""
  # -- When true (default), the chart may create/manage its own Secret from values when no existingSecret is specified
  manageSecret: true
  # -- Use an existing Secret for the ignite user password instead of a chart-managed Secret
  existingSecret:
    # -- Name of the existing Secret containing the ignite user password
    name: ""
    # -- Key in the existing Secret that holds the password (defaults to 'ignite-user-password')
    key: ""
    # -- Key in the existing Secret that holds the previous password (defaults to 'ignite-user-previous-password'; optional)
    previousKey: ""

# -- Enable the Ignite's [Zero Deployment](https://ignite.apache.org/docs/ignite2/latest/code-deployment/peer-class-loading.html#enabling-peer-class-loading)
peerClassLoadingEnabled: false

# -- Timeouts
timeouts:
  # -- Failure detection timeout in milliseconds
  failureDetectionTimeout: 30000
  # -- Client failure detection timeout in milliseconds
  clientFailureDetectionTimeout: 60000
  # -- Network timeout in milliseconds
  networkTimeout: 10000

# -- Thread pools
threadPools:
  # -- Public thread pool size
  publicThreadPoolSize: ""
  # -- System thread pool size
  systemThreadPoolSize: ""
  # -- Query thread pool size
  queryThreadPoolSize: ""
  # -- Service thread pool size
  serviceThreadPoolSize: ""
  # -- Striped thread pool size
  stripedPoolSize: ""
  # -- Data streamer thread pool size
  dataStreamerThreadPoolSize: ""

# -- User attributes
userAttributes: |-

# -- Binary configuration
binaryConfiguration: |-

# -- Cache configuration
cacheConfiguration: |-

# -- Cache key configuration
cacheKeyConfiguration: |-

# -- Client connector configuration
clientConnector:
  # -- Extra configuration for org.apache.ignite.configuration.ClientConnectorConfiguration bean
  extraConfiguration: |-

# -- Data storage configuration
dataStorage:
  # -- Off-heap eviction policy for in-memory mode (e.g., RANDOM_LRU)
  pageEvictionMode: ""
  # -- Extra configuration for org.apache.ignite.configuration.DataStorageConfiguration bean
  extraConfiguration: |-

# -- Executor configuration
executorConfiguration: |-

# -- Memory configuration
memoryConfiguration: |-

# -- Service configuration
serviceConfiguration: |-

# -- SQL configuration
sqlConfiguration: |-

# -- Number of SQL queries each node keeps in its history (defaults to 0, as the node that ran the activation job's
# ALTER USER would keep the new password there until restart, readable by every SQL user; empty uses Ignite's default;
# ignored with sqlConfiguration)
sqlQueryHistorySize: 0

# -- Transaction configuration
transactionConfiguration: |-

# -- SSL configuration
ssl:
  # -- Enable SSL
  enabled: false
  # -- Key manager algorithm that will be used to create a key manager
  keyAlgorithm: SunX509
  # -- Path to the keystore that stores Ignite node certificates
  keyStoreFilePath: ""
  # -- Password used to access the keystore defined above
  keyStorePassword: ""
  # -- Key store type
  keyStoreType: JKS
  # -- Path to the truststore used to validate connecting clients
  trustStoreFilePath: ""
  # -- Password used to access the truststore defined above
  trustStorePassword: ""
  # -- Trust store type
  trustStoreType: JKS
  # -- Protocol
  protocol: TLSv1.2
  # -- SSL client connector configuration
  clientConnector:
    # -- Enable SSL for the client connector
    enabled: false
    # -- Client authentication for the client connector
    clientAuth: false
  # -- When true (default), the chart may create/manage its own Secret from values when no existingSecret is specified
  manageSecret: true
  # -- Use an existing Secret for SSL keystore/truststore passphrases instead of a chart-managed Secret
  existingSecret:
    # -- Name of the existing Secret containing SSL passphrase keys
    name: ""
    # -- Optional mapping to override the expected key names in the existing Secret
    keys:
      # -- Key for the keystore password (defaults to 'ignite-ssl-ks-pass')
      ksPass: ""
      # -- Key for the truststore password (defaults to 'ignite-ssl-ts-pass')
      tsPass: ""

# -- Collision SPI
collisionSpi: |-

# -- Communication SPI
communicationSpi: |-
  <bean class="org.apache.ignite.spi.communication.tcp.TcpCommunicationSpi">
      <property name="messageQueueLimit" value="2048"/>
      <property name="slowClientQueueLimit" value="2048"/>
      <property name="socketWriteTimeout" value="5000"/>
      <property name="connectTimeout" value="10000"/>
  </bean>

# -- Deployment SPI
deploymentSpi: |-

# -- Encryption SPI
encryptionSpi: |-

# -- Failover SPI
failoverSpi: |-

# -- Load balancing SPI
loadBalancingSpi: |-

metrics:
  # -- Enable metrics, exposed for Prometheus on container.ports.metrics (/metrics, with the prometheus.io pod annotations)
  enabled: false

tracing:
  # -- Enable tracing
  enabled: false

# -- Environment variables
env:
  EXTRA_JVM_OPTS: ""
  EXTRA_OPTION_LIBS: ""

activationJob:
  # -- Enable the cluster activation job
  enabled: true
  # -- Maximum duration of the job in seconds (it waits for every pod)
  activeDeadlineSeconds: 1800
  # -- Image for the cluster activation job
  image:
    registry: docker.io
    repository: curlimages/curl
    tag: 8.17.0
    pullPolicy: IfNotPresent
  # -- Resources for the cluster activation job
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 128Mi
