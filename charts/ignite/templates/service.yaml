apiVersion: v1
kind: Service
metadata:
  name: {{ include "ignite.fullname" . }}
  labels:
    {{- include "ignite.labels" . | nindent 4 }}
  {{- with (include "ignite.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    # The discovery and communication ports are exposed on the headless Service only
    - name: jdbc
      port: {{ .Values.service.ports.jdbc }}
      targetPort: {{ .Values.container.ports.jdbc }}
    - name: sql
      port: {{ .Values.service.ports.sql }}
      targetPort: {{ .Values.container.ports.sql }}
    - name: rest
      port: {{ .Values.service.ports.rest }}
      targetPort: {{ .Values.container.ports.rest }}
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: {{ .Values.service.ports.metrics }}
      targetPort: {{ .Values.container.ports.metrics }}
    {{- end }}
  selector:
    {{- include "ignite.selectorLabels" . | nindent 4 }}
  sessionAffinity: None
