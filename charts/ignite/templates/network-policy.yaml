{{- if .Values.networkPolicy.create }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.networkPolicy.name | default (include "ignite.fullname" .) }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "ignite.labels" . | nindent 4 }}
  {{- with (include "ignite.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  egress:
    {{- if .Values.networkPolicy.allowIntraCluster }}
    # Allow traffic between the pods of this release (e.g., node-to-node communication)
    - to:
        - podSelector:
            matchLabels: {{- include "ignite.selectorLabels" . | nindent 14 }}
    {{- end }}
    {{- with .Values.networkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  ingress:
    {{- if .Values.networkPolicy.allowTests }}
    # Allow traffic from the chart's test pods (helm test)
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "ignite.name" . }}-test
              app.kubernetes.io/instance: {{ .Release.Name }}
    {{- end }}
    {{- if .Values.networkPolicy.allowIntraCluster }}
    # Allow traffic from the activation job, which calls the REST API
    - from:
        - podSelector:
            matchLabels: {{- include "ignite.activationJobLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.container.ports.rest }}
          protocol: TCP
    # Allow traffic between the pods of this release (e.g., node-to-node communication)
    - from:
        - podSelector:
            matchLabels: {{- include "ignite.selectorLabels" . | nindent 14 }}
    {{- end }}
    {{- with .Values.networkPolicy.ingress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  podSelector:
    matchLabels: {{- include "ignite.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
{{- end }}
