apiVersion: v1
kind: Pod
metadata:
  name: {{ include "ignite.fullname" . }}-test-connection
  labels:
    {{- include "ignite.testLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  {{- with .Values.global.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: {{ .Values.global.imageRegistry | default "docker.io" }}/busybox:1.36
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1001
      command:
        - /bin/sh
        - -c
        - |
          url="http://{{ include "ignite.fullname" . }}:{{ .Values.service.ports.rest }}/ignite?cmd=version"
          echo "Testing $url..."
          # The Service may take a moment to route to the pods that just became ready
          for attempt in $(seq 1 12); do
            if wget --spider --timeout=10 "$url"; then
              echo "Connection test PASSED"
              exit 0
            fi
            sleep 5
          done
          echo "Connection test FAILED"
          exit 1
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
