apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ignite.fullname" . }}-cluster
  labels:
    {{- include "ignite.labels" . | nindent 4 }}
  {{- with (include "ignite.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "ignite.selectorLabels" . | nindent 6 }}
  serviceName: {{ include "ignite.fullname" . }}-svc-headless
  replicas: {{ .Values.replicaCount }}
  {{- if .Values.podManagementPolicy }}
  podManagementPolicy: {{ .Values.podManagementPolicy }}
  {{- end }}
  {{- with .Values.minReadySeconds }}
  minReadySeconds: {{ . }}
  {{- end }}
  {{- if not (has (toString .Values.revisionHistoryLimit) (list "" "<nil>")) }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  {{- end }}
  {{- if .Values.updateStrategy }}
  updateStrategy:
    type: {{ .Values.updateStrategy.type }}
    {{- if .Values.updateStrategy.rollingUpdate }}
    rollingUpdate: {{- toYaml .Values.updateStrategy.rollingUpdate | nindent 6 }}
    {{- end }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "ignite.podLabels" . | nindent 8 }}
      annotations:
        kubectl.kubernetes.io/default-container: ignite-node
        checksum/config: {{ include (print $.Template.BasePath "/config-map.yaml") . | sha256sum }}
        {{- if .Values.jmx.enabled }}
        checksum/jmx-config: {{ include (print $.Template.BasePath "/config-map-jmx.yaml") . | sha256sum }}
        {{- end }}
        # Rollout on secret reference changes
        creds/ignite-auth-secret: {{ (default (printf "%s-auth" (include "ignite.fullname" .)) .Values.authentication.existingSecret.name) | quote }}
        creds/ignite-ssl-secret: {{ (default (printf "%s-ssl" (include "ignite.fullname" .)) .Values.ssl.existingSecret.name) | quote }}
        # Rollout on SSL password changes (the nodes read them at start)
        checksum/ssl: {{ include (print $.Template.BasePath "/secret-ssl.yaml") . | sha256sum }}
        {{- if .Values.jmx.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.jmx.port | quote }}
        prometheus.io/path: /metrics
        {{- end }}
        {{- with (include "ignite.podAnnotations" .) }}
        {{- . | nindent 8 }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      serviceAccountName: {{ include "ignite.serviceAccountName" . }}
      # The nodes find each other through the headless Service (static node finder), without the Kubernetes API
      automountServiceAccountToken: {{ .Values.rbac.create }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.podSecurityContext.enabled }}
      securityContext:
        {{- toYaml (omit .Values.podSecurityContext "enabled") | nindent 8 }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName | quote }}
      {{- end }}
      {{- if or .Values.extraInitContainers .Values.jmx.enabled }}
      initContainers:
        {{- if .Values.extraInitContainers }}
        {{- toYaml .Values.extraInitContainers | nindent 8 }}
        {{- end }}
        {{- if .Values.jmx.enabled }}
        - name: jmx-agent-init
          image: {{ include "ignite.jmxAgent.image" . }}
          imagePullPolicy: {{ .Values.jmx.agent.image.pullPolicy }}
          {{- if .Values.containerSecurityContext.enabled }}
          securityContext:
            {{- toYaml (merge (dict "readOnlyRootFilesystem" true) (omit .Values.containerSecurityContext "enabled")) | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.jmx.agent.resources | nindent 12 }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              wget -q -O /agent/jmx.jar.tmp {{ .Values.jmx.agent.url | quote }}
              # Refuses a jar other than the expected one
              echo {{ printf "%s  /agent/jmx.jar.tmp" .Values.jmx.agent.sha256 | quote }} | sha256sum -c -
              mv /agent/jmx.jar.tmp /agent/jmx.jar
          volumeMounts:
            - name: jmx-agent
              mountPath: /agent
        {{- end }}
      {{- end }}
      containers:
        {{- if .Values.extraContainers }}
        {{- toYaml .Values.extraContainers | nindent 8 }}
        {{- end }}
        - name: ignite-node
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: JVM_MIN_MEM
              value: "{{ default 1024 .Values.memory.onHeapMB }}M"
            - name: JVM_MAX_MEM
              value: "{{ default 1024 .Values.memory.onHeapMB }}M"
            - name: JVM_GC
              value: "G1GC"
            - name: JVM_G1HeapRegionSize
              value: "{{ include "ignite.g1HeapRegionSizeMB" . }}M"
            # Must be specified to ensure that Ignite 3 cluster replicas are visible to each other.
            - name: IGNITE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Writable locations for the CLI (kubectl exec), as the root filesystem may be read-only
            - name: HOME
              value: /home/ignite
            - name: XDG_CONFIG_HOME
              value: /home/ignite/.config
            - name: XDG_STATE_HOME
              value: /home/ignite/.local/state
            - name: IGNITE_CLI_WORK_DIR
              value: /home/ignite/ignite3cli
            {{- if .Values.persistence.enabled }}
            - name: IGNITE_WORK_DIR
              value: /persistence
            {{- end }}
            - name: IGNITE3_EXTRA_JVM_ARGS
              value: >-
                -server
                -XX:+AlwaysActAsServerClassMachine
                -XX:+UseContainerSupport
                -XX:+AlwaysPreTouch
                -XX:MaxGCPauseMillis=200
                -XX:+ExplicitGCInvokesConcurrent
                -XX:+UseStringDeduplication
                -XX:+ParallelRefProcEnabled
                -XX:-OmitStackTraceInFastThrow
                -XX:+ExitOnOutOfMemoryError
                -XX:+HeapDumpOnOutOfMemoryError
                -XX:HeapDumpPath=/tmp/heapdump.hprof
                -XX:MaxMetaspaceSize={{ default 256 .Values.memory.maxMetaspaceSizeMB }}M
                -XX:ReservedCodeCacheSize={{ default 240 .Values.memory.reservedCodeCacheSizeMB }}M
                -XX:MaxDirectMemorySize={{ required "A valid memory.maxDirectMemorySizeMB is required!" .Values.memory.maxDirectMemorySizeMB }}M
                {{- if .Values.jmx.enabled }}
                -javaagent:/agent/jmx.jar={{ .Values.jmx.port }}:/opt/jmx/jmx.yaml
                {{- end }}
                -Djava.net.preferIPv4Stack=true
                {{ .Values.env.EXTRA_JVM_OPTS }}
            #region For the Ignite 3 HOCON configurations environment variables substitutions (e.g., password=${?IGNITE_USER_PASSWORD}).
            - name: IGNITE_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if .Values.authentication.existingSecret.name }}
                  name: {{ .Values.authentication.existingSecret.name }}
                  key: {{ default "ignite-user-password" .Values.authentication.existingSecret.key }}
                  {{- else }}
                  name: {{ include "ignite.fullname" . }}-auth
                  key: ignite-user-password
                  {{- end }}
                  optional: true
            - name: CLIENT_CONNECTOR_KS_PASS
              valueFrom:
                secretKeyRef:
                  {{- if .Values.ssl.existingSecret.name }}
                  name: {{ .Values.ssl.existingSecret.name }}
                  key: {{ default "client-connector-ks-pass" .Values.ssl.existingSecret.keys.clientConnectorKsPass }}
                  {{- else }}
                  name: {{ include "ignite.fullname" . }}-ssl
                  key: client-connector-ks-pass
                  {{- end }}
                  optional: true
            - name: CLIENT_CONNECTOR_TS_PASS
              valueFrom:
                secretKeyRef:
                  {{- if .Values.ssl.existingSecret.name }}
                  name: {{ .Values.ssl.existingSecret.name }}
                  key: {{ default "client-connector-ts-pass" .Values.ssl.existingSecret.keys.clientConnectorTsPass }}
                  {{- else }}
                  name: {{ include "ignite.fullname" . }}-ssl
                  key: client-connector-ts-pass
                  {{- end }}
                  optional: true
            - name: NETWORK_KS_PASS
              valueFrom:
                secretKeyRef:
                  {{- if .Values.ssl.existingSecret.name }}
                  name: {{ .Values.ssl.existingSecret.name }}
                  key: {{ default "network-ks-pass" .Values.ssl.existingSecret.keys.networkKsPass }}
                  {{- else }}
                  name: {{ include "ignite.fullname" . }}-ssl
                  key: network-ks-pass
                  {{- end }}
                  optional: true
            - name: NETWORK_TS_PASS
              valueFrom:
                secretKeyRef:
                  {{- if .Values.ssl.existingSecret.name }}
                  name: {{ .Values.ssl.existingSecret.name }}
                  key: {{ default "network-ts-pass" .Values.ssl.existingSecret.keys.networkTsPass }}
                  {{- else }}
                  name: {{ include "ignite.fullname" . }}-ssl
                  key: network-ts-pass
                  {{- end }}
                  optional: true
            - name: REST_KS_PASS
              valueFrom:
                secretKeyRef:
                  {{- if .Values.ssl.existingSecret.name }}
                  name: {{ .Values.ssl.existingSecret.name }}
                  key: {{ default "rest-ks-pass" .Values.ssl.existingSecret.keys.restKsPass }}
                  {{- else }}
                  name: {{ include "ignite.fullname" . }}-ssl
                  key: rest-ks-pass
                  {{- end }}
                  optional: true
            - name: REST_TS_PASS
              valueFrom:
                secretKeyRef:
                  {{- if .Values.ssl.existingSecret.name }}
                  name: {{ .Values.ssl.existingSecret.name }}
                  key: {{ default "rest-ts-pass" .Values.ssl.existingSecret.keys.restTsPass }}
                  {{- else }}
                  name: {{ include "ignite.fullname" . }}-ssl
                  key: rest-ts-pass
                  {{- end }}
                  optional: true
            #endregion
            {{- range $name, $value := .Values.env }}
            {{- if ne $name "EXTRA_JVM_OPTS" }}
            - name: {{ $name | quote }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.extraEnvVars }}
            {{- toYaml .Values.extraEnvVars | nindent 12 }}
            {{- end }}
          {{- if or .Values.extraEnvFrom .Values.extraEnvVarsCM .Values.extraEnvVarsSecret }}
          envFrom:
            {{- if .Values.extraEnvFrom }}
            {{- toYaml .Values.extraEnvFrom | nindent 12 }}
            {{- end }}
            {{- if .Values.extraEnvVarsCM }}
            - configMapRef:
                name: {{ .Values.extraEnvVarsCM }}
            {{- end }}
            {{- if .Values.extraEnvVarsSecret }}
            - secretRef:
                name: {{ .Values.extraEnvVarsSecret }}
            {{- end }}
          {{- end }}
          image: {{ include "ignite.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.containerSecurityContext.enabled }}
          securityContext:
            {{- toYaml (omit .Values.containerSecurityContext "enabled") | nindent 12 }}
          {{- end }}
          ports:
            - name: management
              containerPort: {{ .Values.container.ports.management }}
              protocol: TCP
            - name: management-ssl
              containerPort: {{ .Values.container.ports.managementSsl }}
              protocol: TCP
            - name: rest
              containerPort: {{ .Values.container.ports.rest }}
              protocol: TCP
            - name: cluster
              containerPort: {{ .Values.container.ports.cluster }}
              protocol: TCP
            {{- if .Values.jmx.enabled }}
            - name: jmx
              containerPort: {{ .Values.jmx.port }}
              protocol: TCP
            {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe: {{- include "ignite.probe" (dict "probe" .Values.startupProbe "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe: {{- include "ignite.probe" (dict "probe" .Values.livenessProbe "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe: {{- include "ignite.probe" (dict "probe" .Values.readinessProbe "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.lifecycleHooks }}
          lifecycle: {{- include "common.tplvalues.render" (dict "value" .Values.lifecycleHooks "context" $) | nindent 12 }}
          {{- end }}
          volumeMounts:
            # Writable directories (the root filesystem may be read-only): heap dumps and the native libraries unpacked by
            # Netty and RocksDB, the CLI's home and, without persistence, the work directory
            - mountPath: /tmp
              name: tmp
            - mountPath: /home/ignite
              name: home
            {{- if not .Values.persistence.enabled }}
            - mountPath: /opt/ignite/work
              name: work
            {{- end }}
            - mountPath: /opt/ignite/etc/ignite-config.conf
              name: config-map-vol
              subPath: ignite-config.conf
            {{- if .Values.persistence.enabled }}
            - mountPath: /persistence
              name: persistence
            {{- end }}
            {{- if .Values.jmx.enabled }}
            - name: jmx-agent
              mountPath: /agent
            - name: jmx-config-map-vol
              mountPath: /opt/jmx/jmx.yaml
              subPath: jmx.yaml
            {{- end }}
            {{- if .Values.extraVolumeMounts }}
            {{- toYaml .Values.extraVolumeMounts | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: { }
        - name: home
          emptyDir: { }
        {{- if not .Values.persistence.enabled }}
        - name: work
          emptyDir: { }
        {{- end }}
        - name: config-map-vol
          configMap:
            name: {{ include "ignite.fullname" . }}
        {{- if .Values.jmx.enabled }}
        - name: jmx-agent
          emptyDir: { }
        - name: jmx-config-map-vol
          configMap:
            name: {{ include "ignite.fullname" . }}-jmx
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: persistence
        {{- if .Values.persistence.labels }}
        labels:
          {{- toYaml .Values.persistence.labels | nindent 10 }}
        {{- end }}
        {{- if .Values.persistence.annotations }}
        annotations:
          {{- toYaml .Values.persistence.annotations | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- if .Values.persistence.persistentVolumeClaimRetentionPolicy.enabled }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: {{ .Values.persistence.persistentVolumeClaimRetentionPolicy.whenDeleted }}
    whenScaled: {{ .Values.persistence.persistentVolumeClaimRetentionPolicy.whenScaled }}
  {{- end }}
  {{- end }}
