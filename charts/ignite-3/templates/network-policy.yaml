{{- if .Values.networkPolicy.create }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.networkPolicy.name | default (include "ignite.fullname" .) }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "ignite.labels" . | nindent 4 }}
  {{- with (include "ignite.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  egress:
    {{- if .Values.networkPolicy.allowIntraCluster }}
    # Allow traffic between the pods of this release (e.g., node-to-node communication, init/activation job, tests)
    - to:
        - podSelector:
            matchLabels: {{- include "ignite.selectorLabels" . | nindent 14 }}
    {{- end }}
    {{- with .Values.networkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  ingress:
    {{- if .Values.networkPolicy.allowIntraCluster }}
    # Allow traffic between the pods of this release (e.g., node-to-node communication, init/activation job, tests)
    - from:
        - podSelector:
            matchLabels: {{- include "ignite.selectorLabels" . | nindent 14 }}
    {{- end }}
    {{- with .Values.networkPolicy.ingress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  podSelector:
    matchLabels: {{- include "ignite.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
{{- end }}
