{{- include "ignite.validate" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ignite.fullname" . }}
  labels:
    {{- include "ignite.labels" . | nindent 4 }}
  {{- with (include "ignite.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
data:
  ignite-config.conf: |
    ignite {
        clientConnector {
            connectTimeoutMillis=5000
            idleTimeoutMillis=0
            listenAddresses=[]
            metricsEnabled=true
            port={{ .Values.container.ports.rest }}
            sendServerExceptionStackTraceToClient=false
            ssl {
                ciphers="{{ .Values.ssl.clientConnector.ciphers }}"
                clientAuth={{ .Values.ssl.clientConnector.clientAuth }}
                enabled={{ .Values.ssl.clientConnector.enabled }}
                keyStore {
                    password={{ .Values.ssl.clientConnector.keyStorePassword | toJson }}
                    path={{ .Values.ssl.clientConnector.keyStoreFilePath | toJson }}
                    type="{{ .Values.ssl.clientConnector.keyStoreType }}"
                }
                trustStore {
                    password={{ .Values.ssl.clientConnector.trustStorePassword | toJson }}
                    path={{ .Values.ssl.clientConnector.trustStoreFilePath | toJson }}
                    type="{{ .Values.ssl.clientConnector.trustStoreType }}"
                }
            }
        }
        compute {
            queueMaxSize=2147483647
            statesLifetimeMillis=60000
            threadPoolSize=10
        }
        deployment {
            location=deployment
        }
        failureHandler {
            dumpThreadsOnFailure=true
            dumpThreadsThrottlingTimeoutMillis=10000
            handler {
                ignoredFailureTypes=[
                    systemWorkerBlocked,
                    systemCriticalOperationTimeout
                ]
                # The node stops and its container restarts (the default since Ignite 3.2)
                type=stop
            }
            oomBufferSizeBytes=16384
        }
        network {
            inbound {
                soBacklog=128
                soKeepAlive=true
                soLinger=0
                soReuseAddr=true
                tcpNoDelay=true
            }
            listenAddresses=[]
            membership {
                failurePingIntervalMillis=1000
                membershipSyncIntervalMillis=30000
                scaleCube {
                    failurePingRequestMembers=3
                    gossipIntervalMillis=200
                    gossipRepeatMult=3
                    membershipSuspicionMultiplier=5
                    metadataTimeoutMillis=3000
                }
            }
            nodeFinder {
                netClusterNodes=[
                  # Kubernetes service to access the Ignite 3 cluster on the Kubernetes network
                  "{{ include "ignite.fullname" . }}-svc-headless:{{ .Values.container.ports.cluster }}"
                ]
                type=STATIC
            }
            outbound {
                soKeepAlive=true
                soLinger=0
                tcpNoDelay=true
            }
            port={{ .Values.container.ports.cluster }}
            shutdownQuietPeriodMillis=0
            shutdownTimeoutMillis=15000
            ssl {
                ciphers="{{ .Values.ssl.network.ciphers }}"
                clientAuth={{ .Values.ssl.network.clientAuth }}
                enabled={{ .Values.ssl.network.enabled }}
                keyStore {
                    password={{ .Values.ssl.network.keyStorePassword | toJson }}
                    path={{ .Values.ssl.network.keyStoreFilePath | toJson }}
                    type="{{ .Values.ssl.network.keyStoreType }}"
                }
                trustStore {
                    password={{ .Values.ssl.network.trustStorePassword | toJson }}
                    path={{ .Values.ssl.network.trustStoreFilePath | toJson }}
                    type="{{ .Values.ssl.network.trustStoreType }}"
                }
            }
        }
        raft {
            fsync=false
            installSnapshotTimeoutMillis=2147483647
            logStripesCount=4
            logYieldStrategy=false
            responseTimeoutMillis=3000
            retryDelayMillis=200
            retryTimeoutMillis=10000
            stripes=10
            volatileRaft {
                logStorageBudget {
                    name=unlimited
                }
            }
        }
        rest {
            dualProtocol={{ .Values.ssl.rest.enabled }}
            httpToHttpsRedirection=false
            port={{ .Values.container.ports.management }}
            ssl {
                ciphers="{{ .Values.ssl.rest.ciphers }}"
                clientAuth={{ .Values.ssl.rest.clientAuth }}
                enabled={{ .Values.ssl.rest.enabled }}
                keyStore {
                    password={{ .Values.ssl.rest.keyStorePassword | toJson }}
                    path={{ .Values.ssl.rest.keyStoreFilePath | toJson }}
                    type="{{ .Values.ssl.rest.keyStoreType }}"
                }
                port={{ .Values.container.ports.managementSsl }}
                trustStore {
                    password={{ .Values.ssl.rest.trustStorePassword | toJson }}
                    path={{ .Values.ssl.rest.trustStoreFilePath | toJson }}
                    type="{{ .Values.ssl.rest.trustStoreType }}"
                }
            }
        }
        sql {
            execution {
                threadCount=4
            }
            planner {
                threadCount=4
            }
        }
        storage {
            engines {
                aimem {
                    pageSizeBytes=16384
                }
                aipersist {
                    checkpoint {
                        checkpointDelayMillis=200
                        checkpointThreads=4
                        compactionThreads=4
                        intervalDeviationPercent=40
                        intervalMillis=180000
                        logReadLockThresholdTimeoutMillis=0
                        readLockTimeoutMillis=10000
                    }
                    pageSizeBytes=16384
                }
                rocksdb {
                    flushDelayMillis=100
                }
            }
            {{- $sizeBytes := mul (required "A valid memory.offHeapMB is required!" .Values.memory.offHeapMB) 1024 1024 }}
            profiles=[
                {
                    engine={{ .Values.dataStorage.engine }}
                    name=default
                    {{- if eq .Values.dataStorage.engine "aimem" }}
                    initSizeBytes={{ $sizeBytes }}
                    maxSizeBytes={{ $sizeBytes }}
                    {{- else if eq .Values.dataStorage.engine "rocksdb" }}
                    sizeBytes={{ $sizeBytes }}
                    writeBufferSizeBytes=67108864
                    {{- else }}
                    replacementMode=CLOCK
                    sizeBytes={{ $sizeBytes }}
                    {{- end }}
                }
            ]
        }
        system {
            cmgPath=""
            criticalWorkers {
                livenessCheckIntervalMillis=200
                maxAllowedLagMillis=500
                nettyThreadsHeartbeatIntervalMillis=100
            }
            metastoragePath=""
            partitionsBasePath=""
            partitionsLogPath=""
        }
    }
    {{- with .Values.extraConfiguration }}
    # extraConfiguration (merged into the configuration above; a list, e.g., storage.profiles, replaces the chart's)
    {{- . | nindent 4 }}
    {{- end }}
