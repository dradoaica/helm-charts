# Values for the Apache Ignite 3.1.0 image, until 3.2.0 (the chart's appVersion) is released
#
# The /health/liveness and /health/readiness endpoints of the default probes are new in Ignite 3.2: these probes check
# the REST port instead (a pod is then ready as soon as its node listens, before the cluster is initialized)
#
# Install with:
#   helm install ignite-3 ./charts/ignite-3 -f ./charts/ignite-3/examples/ignite-3.1-values.yaml

image:
  tag: "3.1.0"
startupProbe:
  httpGet: null
  tcpSocket:
    port: 10300
livenessProbe:
  httpGet: null
  tcpSocket:
    port: 10300
readinessProbe:
  httpGet: null
  tcpSocket:
    port: 10300
