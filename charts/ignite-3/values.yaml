# Upgrading from 3.1.1 or a withdrawn 3.2.x: see the Upgrading section of README.md

global:
  # -- Global container image registry override
  imageRegistry: ""
  # -- Global pod image pull secrets
  imagePullSecrets: [ ]

# -- String to partially override the fullname template with a string (will prepend the release name)
nameOverride: ""
# -- String to fully override the fullname template with a string
fullnameOverride: ""

# -- Additional labels to add to all resources
labels: { }
# -- Additional labels to add to pods
podLabels: { }

# -- Annotations to add to all resources
annotations: { }
# -- Additional annotations to add to pods
podAnnotations: { }

# -- Extra init containers to inject into the main Pod spec
extraInitContainers: [ ]
# -- Extra sidecar containers to inject into the main Pod spec
extraContainers: [ ]
# -- Extra volumes to add to the main Pod spec
extraVolumes: [ ]
# -- Extra volume mounts to add to the main container
extraVolumeMounts: [ ]
# -- Extra environment variables to inject into the main container
extraEnvVars: [ ]
# -- Extra envFrom entries to inject into the main container
extraEnvFrom: [ ]
# -- Name of a ConfigMap with extra environment variables to inject into the main container
extraEnvVarsCM: ""
# -- Name of a Secret with extra environment variables to inject into the main container
extraEnvVarsSecret: ""

image:
  # -- Main container image registry
  registry: docker.io
  # -- Main container image repository
  repository: apacheignite/ignite
  # -- Main container image tag (defaults to appVersion when empty)
  tag: ""
  # -- Main container image pull policy
  pullPolicy: IfNotPresent

serviceAccount:
  # -- Create a dedicated ServiceAccount
  create: true
  # -- Name for the ServiceAccount (autogenerated when empty)
  name: ""
  # -- Additional annotations to add to ServiceAccount
  annotations: { }

rbac:
  # -- Create RBAC items (e.g., role, role-binding) and mount the ServiceAccount token in the pods (not needed by
  # Ignite,
  # whose nodes find each other through the headless Service)
  create: false

# -- StatefulSet pod management policy
podManagementPolicy: OrderedReady
# -- Number of old StatefulSet revisions (ControllerRevisions) to retain
revisionHistoryLimit: 10

# -- StatefulSet update strategy
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    partition: 0

# -- Seconds a started pod must stay ready before the next one starts or restarts (gives the restarted node time to
# catch up on its replicas; raise it for large data sets)
minReadySeconds: 60

# -- Pod priority class name
priorityClassName: ""

# -- Pod termination grace period
terminationGracePeriodSeconds: 60

# -- Pod security context configuration
podSecurityContext:
  # -- Enable pod security context
  enabled: true
  runAsUser: 1001
  runAsGroup: 1001
  runAsNonRoot: true
  fsGroup: 1001

# -- Container security context configuration
containerSecurityContext:
  # -- Enable container security context
  enabled: true
  runAsUser: 1001
  runAsGroup: 1001
  runAsNonRoot: true
  privileged: false
  # The chart mounts writable emptyDir volumes for /tmp, the CLI's home and, without persistence, the work directory
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ "ALL" ]
  seccompProfile:
    type: RuntimeDefault

# -- Main container requests/limits with guaranteed QoS (requests = limits)
#  memory calculation: onHeapMB (JVM Heap max size)
#   + maxMetaspaceSizeMB (JVM Metaspace max size)
#   + reservedCodeCacheSizeMB (JVM ReservedCodeCache size)
#   + offHeapMB (default storage profile max size; data + indexes (basic use cases will add a 30% increase on top of
# data))
#   + MIN(256MB, offHeapMB) (offHeapMB < 1 GB)
#     || offHeapMB/4 (offHeapMB between 1 GB and 8 GB)
#     || 2GB (offHeapMB > 8 GB)
#       (default storage profile checkpointing buffer size)
#   + ~512MB (other overheads; e.g., thread stacks, GC, symbols, etc.)
resources:
  requests:
    cpu: "2"
    memory: 5Gi
  limits:
    cpu: "2"
    memory: 5Gi

# The probes check the REST port: Ignite 3.1 has no health endpoints (a pod is then ready as soon as its node listens,
# before the cluster is initialized). For probes on the node state endpoint, see examples/node-state-probes-values.yaml
# -- Liveness probe configuration
livenessProbe:
  # -- Enable liveness probe
  enabled: true
  tcpSocket:
    port: 10300
  initialDelaySeconds: 5
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3
  successThreshold: 1

# -- Readiness probe configuration
readinessProbe:
  # -- Enable readiness probe
  enabled: true
  tcpSocket:
    port: 10300
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 3
  successThreshold: 1

# -- Startup probe configuration
startupProbe:
  # -- Enable startup probe
  enabled: true
  tcpSocket:
    port: 10300
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 15
  successThreshold: 1

# -- Lifecycle hooks configuration
lifecycleHooks: { }

container:
  # -- Container ports used by the Pod spec and as Service targetPort values
  ports:
    # -- REST/Management API (HTTP)
    management: 10300
    # -- REST/Management API (HTTPS)
    managementSsl: 10400
    # -- Client connector (binary protocol for thin clients and JDBC; not HTTP)
    rest: 10800
    cluster: 3344

service:
  # -- Service ports used by the Service spec. targetPort fields reference container.ports.* (cluster is on the headless
  # Service only)
  ports:
    # -- REST/Management API (HTTP)
    management: 10300
    # -- REST/Management API (HTTPS)
    managementSsl: 10400
    # -- Client connector (binary protocol for thin clients and JDBC; not HTTP)
    rest: 10800
    cluster: 3344
    jmx: 9404

persistence:
  # -- Enable persistent settings (the volume keeps the work directory, with the cluster and metastorage state; without
  # it, a restarted node loses that state)
  enabled: true
  persistentVolumeClaimRetentionPolicy:
    # -- Enable persistent volume retention policy
    enabled: false
    # -- Volume retention behavior when the replica count of the StatefulSet is reduced
    whenScaled: Retain
    # -- Volume retention behavior that applies when the StatefulSet is deleted
    whenDeleted: Retain
  # -- Persistent volume size
  size: 10Gi
  # -- Persistent volume storage class (empty string uses cluster default)
  storageClass: ""
  # -- Persistent volume access modes
  accessModes:
    - ReadWriteOnce
  # -- Labels to add to the PersistentVolumeClaim
  labels: { }
  # -- Annotations to add to the PersistentVolumeClaim
  annotations: { }

# -- Node selector
nodeSelector: { }
# -- Node tolerations
tolerations: [ ]
# -- Node affinity
affinity: { }
# -- Topology spread constraints (templated; by default, the pods prefer different Kubernetes nodes, so that a node
# failure takes as few replicas of the same partitions as possible)
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: '{{ include "ignite.name" . }}'
        app.kubernetes.io/instance: '{{ .Release.Name }}'

networkPolicy:
  # -- Create a NetworkPolicy
  create: false
  # -- Name for the NetworkPolicy (defaults to fullname when empty)
  name: ""
  # -- Allow ingress from the chart's test pods (helm test)
  allowTests: true
  # -- Allow ingress/egress traffic between the pods of this release (required for cluster communication)
  allowIntraCluster: true
  # -- NetworkPolicy ingress rules (add rules for clients that need access to the cluster)
  ingress: [ ]
  # -- NetworkPolicy egress rules (a list set here replaces these defaults, so repeat the DNS rule in it)
  egress:
    # Allow DNS resolution
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow HTTPS for the download of the JMX agent (jmx.agent.url)
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports:
        - port: 443
          protocol: TCP

podDisruptionBudget:
  # -- Create a PodDisruptionBudget (only with more than one replica)
  create: true
  # -- Minimum number of pods that must be available during disruptions (if set, used instead of maxUnavailable)
  minAvailable: ""
  # -- Maximum number of pods that can be unavailable during disruptions (used when minAvailable is empty)
  maxUnavailable: 1

# The autoscaler only scales up (it never removes pods): the CMG/metastorage group is chosen once at initialization from
# the lowest pod ordinals, and removing nodes can lose its majority or partitions.
#  - Every added node triggers rebalancing, which loads the other nodes: keep the scale-up steps small and far apart.
#  - CPU is the only target (the JVM pre-touches its heap, so the memory utilization stays high whatever the load).
#  - Every `helm upgrade` resets the StatefulSet replicas to `replicaCount`: raise it to the current number of pods
#    first.
# Scale down manually via `replicaCount`, with the autoscaler off, one node at a time, and only with replicas
# configured.
autoscaling:
  # -- Create a HorizontalPodAutoscaler that only scales up - see the values.yaml comments
  create: false
  # -- Minimum number of replicas (not below replicaCount)
  minReplicas: 1
  # -- Maximum number of replicas
  maxReplicas: 10
  # -- Target CPU utilization percentage
  targetCPUUtilizationPercentage: 80
  # -- Scale-up behavior (by default, one pod every 10 minutes, as every added node triggers rebalancing)
  scaleUp:
    stabilizationWindowSeconds: 600
    policies:
      - type: Pods
        value: 1
        periodSeconds: 600

ingress:
  # -- Create an Ingress for external HTTP access
  create: false
  # -- IngressClass that will be used to implement the Ingress
  className: ""
  # -- Additional annotations for the Ingress
  annotations: { }
  # -- List of Ingress hosts with paths for REST and Management APIs
  hosts:
    - host: ignite.local
      paths:
        - path: /
          pathType: Prefix
          # REST/Management API (HTTP); the client connector port (10800) is a binary protocol and cannot be exposed
          # via Ingress
          port: 10300
  # -- TLS configuration for Ingress
  tls: [ ]

# App specific
# -- Number of pods
replicaCount: 1

memory:
  # -- On-heap memory limit in MB (the JVM heap; JVM_MIN_MEM and JVM_MAX_MEM). If not set, defaults to 1024
  onHeapMB: ""
  # -- JVM Metaspace max size in MB. If not set, defaults to 256
  maxMetaspaceSizeMB: ""
  # -- JVM ReservedCodeCache size in MB. If not set, defaults to 240
  reservedCodeCacheSizeMB: ""
  # -- JVM G1 Heap region size in MB (a power of 2 from 1 to 32). If not set, what the JVM would choose (about 2048
  # regions; 1 MB for the default heap)
  g1HeapRegionSizeMB: ""
  # -- Off-heap memory limit in MB. Configures the sizeBytes for the default storage profile (data + indexes)
  offHeapMB: 2048
  # -- JVM DirectMemory max size in MB (offHeapMB + checkpointing buffer size)
  maxDirectMemorySizeMB: 2560

authentication:
  # -- Enable authentication
  enabled: true
  # -- Password for the ignite user (defaults to ignite when empty), set by the initialization job at initialization and
  # changed by it on upgrade
  igniteUserPassword: ""
  # -- Current password of the ignite user, when rotating it to igniteUserPassword
  igniteUserPreviousPassword: ""
  # -- When true (default), the chart may create/manage its own Secret from values when no existingSecret is specified
  manageSecret: true
  # -- Use an existing Secret for the ignite user password instead of a chart-managed Secret
  existingSecret:
    # -- Name of the existing Secret containing the ignite user password
    name: ""
    # -- Key in the existing Secret that holds the password (defaults to 'ignite-user-password')
    key: ""
    # -- Key in the existing Secret that holds the previous password (defaults to 'ignite-user-previous-password';
    # optional)
    previousKey: ""

dataStorage:
  # -- Storage engine of the default storage profile, sized by memory.offHeapMB (aipersist for persistence, aimem for
  # in-memory, rocksdb)
  engine: aipersist

# -- Extra node configuration (HOCON), merged into the chart's (e.g., `ignite.sql.execution.threadCount=8`; a list,
# e.g.,
# `ignite.storage.profiles`, replaces the chart's)
extraConfiguration: ""

ssl:
  clientConnector:
    # -- Enable SSL for the client connector
    enabled: false
    # -- Optional cipher suite list for the client connector
    ciphers: ""
    # -- Client authentication mode for the client connector (e.g., none, require)
    clientAuth: none
    # -- Path to the keystore used by the client connector
    keyStoreFilePath: ""
    # -- Password for the client connector keystore
    keyStorePassword: ""
    # -- Keystore type for the client connector
    keyStoreType: PKCS12
    # -- Path to the truststore used by the client connector
    trustStoreFilePath: ""
    # -- Password for the client connector truststore
    trustStorePassword: ""
    # -- Truststore type for the client connector
    trustStoreType: PKCS12
  network:
    # -- Enable SSL for the internal network interface
    enabled: false
    # -- Optional cipher suite list for the network interface
    ciphers: ""
    # -- Client authentication mode for the network interface (e.g., none, require)
    clientAuth: none
    # -- Path to the keystore used by the network interface
    keyStoreFilePath: ""
    # -- Password for the network interface keystore
    keyStorePassword: ""
    # -- Keystore type for the network interface
    keyStoreType: PKCS12
    # -- Path to the truststore used by the network interface
    trustStoreFilePath: ""
    # -- Password for the network interface truststore
    trustStorePassword: ""
    # -- Truststore type for the network interface
    trustStoreType: PKCS12
  rest:
    # -- Enable SSL for the REST endpoint
    enabled: false
    # -- Optional cipher suite list for the REST endpoint
    ciphers: ""
    # -- Client authentication mode for the REST endpoint (e.g., none, require)
    clientAuth: none
    # -- Path to the keystore used by the REST endpoint
    keyStoreFilePath: ""
    # -- Password for the REST endpoint keystore
    keyStorePassword: ""
    # -- Keystore type for the REST endpoint
    keyStoreType: PKCS12
    # -- Path to the truststore used by the REST endpoint
    trustStoreFilePath: ""
    # -- Password for the REST endpoint truststore
    trustStorePassword: ""
    # -- Truststore type for the REST endpoint
    trustStoreType: PKCS12
  # -- When true (default), the chart may create/manage its own Secret from values when no existingSecret is specified
  manageSecret: true
  # -- Use an existing Secret for all SSL-related passphrase keys instead of a chart-managed Secret (not supported with
  # SSL
  # enabled yet, as Ignite 3 reads the passwords from its configuration only: see SECURITY.md)
  existingSecret:
    # -- Name of the existing Secret containing SSL passphrase keys
    name: ""
    # -- Optional mapping to override the expected key names in the existing Secret
    keys:
      # -- Key name for the client connector keystore password (defaults to 'client-connector-ks-pass')
      clientConnectorKsPass: ""
      # -- Key name for the client connector truststore password (defaults to 'client-connector-ts-pass')
      clientConnectorTsPass: ""
      # -- Key name for the network keystore password (defaults to 'network-ks-pass')
      networkKsPass: ""
      # -- Key name for the network truststore password (defaults to 'network-ts-pass')
      networkTsPass: ""
      # -- Key name for the REST keystore password (defaults to 'rest-ks-pass')
      restKsPass: ""
      # -- Key name for the REST truststore password (defaults to 'rest-ts-pass')
      restTsPass: ""

jmx:
  # -- Enable JMX agent sidecar for Prometheus scraping
  enabled: false
  # -- JMX agent port
  port: 9404
  agent:
    # -- URL of the Prometheus JMX exporter Java agent, downloaded when a pod starts (e.g., from an internal mirror)
    url: https://github.com/prometheus/jmx_exporter/releases/download/1.3.0/jmx_prometheus_javaagent-1.3.0.jar
    # -- SHA-256 checksum of the jar at url (the pod does not start with another jar)
    sha256: ba74aad73934e59f4ca9c0779b49f1663c1fc7a81d5d99fc665bd5e5039310f5
    # -- Image of the init container downloading the agent (needs wget and sha256sum)
    image:
      registry: docker.io
      repository: busybox
      tag: 1.36
      pullPolicy: IfNotPresent
    # -- JMX agent container resources
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  # -- JMX exporter configuration
  config: |
    lowercaseOutputName: true
    lowercaseOutputLabelNames: true

# -- Environment variables
env:
  EXTRA_JVM_OPTS: ""

initializationJob:
  # -- Enable the cluster initialization job with topology verification and intelligent CMG sizing
  enabled: true
  # -- Maximum duration of the job in seconds (it waits for every pod)
  activeDeadlineSeconds: 1800
  # -- Resources for the cluster initialization job
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "1"
      memory: 2Gi
