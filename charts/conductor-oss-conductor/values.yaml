# Upgrading from 3.33.1: see the Upgrading section of README.md

global:
  # -- Global container image registry override
  imageRegistry: ""
  # -- Global pod image pull secrets
  imagePullSecrets: [ ]

# -- String to partially override the fullname template with a string (will prepend the release name)
nameOverride: ""
# -- String to fully override the fullname template with a string
fullnameOverride: ""

# -- Additional labels to add to all resources
labels: { }
# -- Additional labels to add to pods
podLabels: { }

# -- Annotations to add to all resources
annotations: { }
# -- Additional annotations to add to pods
podAnnotations: { }

# -- Extra init containers to inject into the main Pod spec
extraInitContainers: [ ]
# -- Extra sidecar containers to inject into the main Pod spec
extraContainers: [ ]
# -- Extra volumes to add to the main Pod spec
extraVolumes: [ ]
# -- Extra volume mounts to add to the main container
extraVolumeMounts: [ ]
# -- Extra environment variables to inject into the main container
extraEnvVars: [ ]
# -- Extra envFrom entries to inject into the main container
extraEnvFrom: [ ]
# -- Name of a ConfigMap with extra environment variables to inject into the main container
extraEnvVarsCM: ""
# -- Name of a Secret with extra environment variables to inject into the main container
extraEnvVarsSecret: ""

image:
  # -- Main container image registry
  registry: docker.io
  # -- Main container image repository
  repository: conductoross/conductor
  # -- Main container image tag
  tag: ""
  # -- Main container image pull policy
  pullPolicy: IfNotPresent

serviceAccount:
  # -- Create a dedicated ServiceAccount
  create: true
  # -- Name for the ServiceAccount (autogenerated when empty)
  name: ""
  # -- Additional annotations to add to ServiceAccount
  annotations: { }

# -- Number of old ReplicaSets to retain
revisionHistoryLimit: 10

# -- Deployment update strategy
updateStrategy:
  type: RollingUpdate

# -- Pod priority class name
priorityClassName: ""

# -- Pod termination grace period
terminationGracePeriodSeconds: 60

# -- Pod security context configuration
podSecurityContext:
  # -- Enable pod security context
  enabled: true
  runAsUser: 1001
  runAsGroup: 1001
  runAsNonRoot: true
  fsGroup: 1001

# -- Container security context configuration
containerSecurityContext:
  # -- Enable container security context
  enabled: true
  runAsUser: 1001
  runAsGroup: 1001
  runAsNonRoot: true
  privileged: false
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ "ALL" ]
  seccompProfile:
    type: RuntimeDefault

# -- Main container requests/limits
#  memory calculation: onHeapMB (JVM Heap max size)
#   + maxMetaspaceSizeMB (JVM Metaspace max size)
#   + reservedCodeCacheSizeMB (JVM ReservedCodeCache size)
#   + maxDirectMemorySizeMB (JVM DirectMemory max size)
#   + ~512MB (other overheads; e.g., thread stacks, GC, symbols, nginx serving the UI, etc.)
#  The JVM pre-touches its whole heap at startup, so request the memory limit
resources:
  requests:
    cpu: 300m
    memory: 3Gi
  limits:
    cpu: "2"
    memory: 3Gi

# -- Liveness probe configuration
livenessProbe:
  # -- Enable liveness probe
  enabled: true
  httpGet:
    path: /health
    port: rest
  initialDelaySeconds: 5
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3
  successThreshold: 1

# -- Readiness probe configuration
readinessProbe:
  # -- Enable readiness probe
  enabled: true
  httpGet:
    path: /health
    port: rest
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 3
  successThreshold: 1

# -- Startup probe configuration
startupProbe:
  # -- Enable startup probe
  enabled: true
  httpGet:
    path: /health
    port: rest
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 15
  successThreshold: 1

# -- Lifecycle hooks configuration (templated; as the image runs Java under a shell that does not forward SIGTERM, the
# default preStop hook waits for the Service to stop routing to the pod, then signals Java, and the container stops when
# Java has shut down)
lifecycleHooks:
  preStop:
    exec:
      command: [ "/bin/sh", "-c", "sleep 5; pid=$(pidof java) && kill -TERM $pid" ]

container:
  # -- Container ports used by the Pod spec and as Service targetPort values (keep rest and ui as they are, as the image's
  # nginx serves the UI on 5000 and proxies the API to localhost:8080)
  ports:
    rest: 8080
    ui: 5000
    grpc: 8090

service:
  # -- Service type (ClusterIP, NodePort, LoadBalancer)
  type: ClusterIP
  # -- Service ports used by the Service spec. targetPort fields reference container.ports.*
  ports:
    # -- Service port for REST API
    rest: 8080
    # -- Service port for UI
    ui: 5000
    # -- Service port for gRPC
    grpc: 8090
  nodePorts:
    # -- NodePort value for REST API when service.type is NodePort
    rest: ""
    # -- NodePort value for UI when service.type is NodePort
    ui: ""
    # -- NodePort value for gRPC when service.type is NodePort
    grpc: ""

# -- Node selector
nodeSelector: { }
# -- Node tolerations
tolerations: [ ]
# -- Node affinity
affinity: { }
# -- Topology spread constraints (templated; by default, the pods prefer different Kubernetes nodes)
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: '{{ include "conductor-oss-conductor.name" . }}'
        app.kubernetes.io/instance: '{{ .Release.Name }}'

networkPolicy:
  # -- Create a NetworkPolicy
  create: false
  # -- Name for the NetworkPolicy (defaults to fullname when empty)
  name: ""
  # -- Allow ingress from the chart's test pods (helm test)
  allowTests: true
  # -- Allow egress to the ports of the configured backends on any host (Redis, the database, the indexing backend, the event
  # queues; other destinations, e.g., webhooks, payload storage, AI providers or Kafka brokers advertising other ports than
  # the bootstrap servers, need egress rules)
  allowBackends: true
  # -- NetworkPolicy ingress rules (add rules for clients that need access to the API/UI)
  ingress: [ ]
  # -- NetworkPolicy egress rules
  egress:
    # Allow DNS resolution
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

podDisruptionBudget:
  # -- Create a PodDisruptionBudget for high availability (only with more than one replica)
  create: false
  # -- Minimum number of pods that must be available during disruptions (if set, used instead of maxUnavailable)
  minAvailable: ""
  # -- Maximum number of pods that can be unavailable during disruptions
  maxUnavailable: 1

autoscaling:
  # -- Create a HorizontalPodAutoscaler
  create: false
  # -- Minimum number of replicas
  minReplicas: 1
  # -- Maximum number of replicas
  maxReplicas: 10
  # -- Target CPU utilization percentage
  targetCPUUtilizationPercentage: 80
  # -- Target memory utilization percentage (not recommended, as the JVM pre-touches its whole heap, so the memory
  # utilization stays high whatever the load)
  targetMemoryUtilizationPercentage: ""

ingress:
  # -- Create an Ingress for external HTTP access
  create: false
  # -- IngressClass that will be used to implement the Ingress
  className: ""
  # -- Additional annotations for the Ingress
  annotations: { }
  # -- List of Ingress hosts with paths for API and UI
  hosts:
    - host: conductor-api.local
      paths:
        - path: /
          pathType: Prefix
          portName: rest
    - host: conductor-ui.local
      paths:
        - path: /
          pathType: Prefix
          portName: ui
  # -- TLS configuration for Ingress
  tls: [ ]

# App specific
# -- Number of pods
replicaCount: 1

# -- Maximum time Conductor waits for the in-flight requests on shutdown (Spring's graceful shutdown; keep the preStop delay
# in lifecycleHooks plus this timeout below terminationGracePeriodSeconds)
gracefulShutdownTimeout: 30s

memory:
  # -- On-heap memory limit in MB. If set, -Xms and -Xmx will be value. If not set, defaults to 1536
  onHeapMB: ""
  # -- JVM Metaspace max size in MB. If not set, defaults to 256
  maxMetaspaceSizeMB: ""
  # -- JVM ReservedCodeCache size in MB. If not set, defaults to 240
  reservedCodeCacheSizeMB: ""
  # -- JVM G1 Heap region size in MB. If not set, defaults to 1
  g1HeapRegionSizeMB: ""
  # -- JVM DirectMemory max size in MB. If not set, defaults to 256
  maxDirectMemorySizeMB: ""

# -- App configuration
app:
  # -- Name of the stack within which the app is running (e.g., dev, testing, staging, prod)
  stack: ""
  # -- The ID with which the app has been registered (e.g., conductor, myApp)
  appID: ""
  # -- The maximum number of threads to be allocated to the executor service threadpool
  executorServiceMaxThreadCount: ""
  # -- The timeout duration to set when a workflow is pushed to the decider queue (e.g., 30s, 1m)
  workflowOffsetTimeout: ""
  # -- The maximum timeout duration to set when a workflow with a running task is pushed to the decider queue (e.g., 30m, 1h)
  maxPostponeDurationSeconds: ""
  # -- The number of threads to use for background sweeping on active workflows
  sweeperThreadCount: ""
  # -- The timeout for polling workflows to be swept (e.g., 2000ms, 2s)
  sweeperWorkflowPollTimeout: ""
  # -- Batch size per sweep poll (e.g., 2)
  sweeperSweepBatchSize: ""
  # -- Queue pop timeout in ms for sweeper (e.g., 100)
  sweeperQueuePopTimeout: ""
  # -- The number of threads to configure the threadpool in the event processor
  eventProcessorThreadCount: ""
  # -- Whether to enable indexing of messages within event payloads
  eventMessageIndexingEnabled: ""
  # -- Whether to enable indexing of event execution results
  eventExecutionIndexingEnabled: ""
  # -- Whether to enable the workflow execution lock
  workflowExecutionLockEnabled: true
  # -- The time for which the lock is leased (e.g., 60000ms, 1m)
  lockLeaseTime: ""
  # -- The time for which the thread will block in an attempt to acquire the lock (e.g., 500ms, 1s)
  lockTimeToTry: 500
  # -- The time to consider if a worker is actively polling for a task (e.g., 10s)
  activeWorkerLastPollTimeout: ""
  # -- The time for which a task execution will be postponed if rate-limited or concurrent execution limited (e.g., 60s)
  taskExecutionPostponeDuration: ""
  # -- Whether to enable indexing of tasks
  taskIndexingEnabled: ""
  # -- Whether to enable indexing of task execution logs
  taskExecLogIndexingEnabled: ""
  # -- Whether to enable asynchronous indexing to Elasticsearch
  asyncIndexingEnabled: ""
  # -- The number of threads in the threadpool for system task workers
  systemTaskWorkerThreadCount: 20
  # -- The maximum number of threads to be polled within the threadpool for system task workers
  systemTaskMaxPollCount: 20
  # -- The interval after which a system task will be checked by the system task worker for completion (e.g., 30s)
  systemTaskWorkerCallbackDuration: ""
  # -- The interval at which system task queues will be polled by system task workers (e.g., 50ms)
  systemTaskWorkerPollInterval: ""
  # -- Queue pop timeout in ms for system tasks (e.g., 100ms)
  systemTaskQueuePopTimeout: ""
  # -- The namespace for the system task workers to provide instance-level isolation
  systemTaskWorkerExecutionNamespace: ""
  # -- The number of threads to be used within the threadpool for system task workers in each isolation group
  isolatedSystemTaskWorkerThreadCount: ""
  # -- After these many polls, begin exponential backoff for system tasks (e.g., 200)
  systemTaskPostponeThreshold: ""
  # -- Per-task-type system task worker settings, rendered as `conductor.app.taskWorkerConfigs.<TASK>.<setting>` (e.g., HTTP: { threadCount: 20 })
  taskWorkerConfigs: { }
  # -- The duration of workflow execution qualifying as short-running when async indexing to Elasticsearch is enabled (defaults to 30s)
  asyncUpdateShortRunningWorkflowDuration: ""
  # -- The delay with which short-running workflows will be updated in Elasticsearch when async indexing is enabled (e.g., 60s)
  asyncUpdateDelay: ""
  # -- Whether to validate the owner email field as mandatory within workflow and task definitions
  ownerEmailMandatory: ""
  # -- The number of threads used in the Scheduler for polling events from multiple event queues
  eventQueueSchedulerPollThreadCount: ""
  # -- The time interval at which the default event queues will be polled (e.g., 100ms)
  eventQueuePollInterval: ""
  # -- The number of messages to be polled from a default event queue in a single operation
  eventQueuePollCount: ""
  # -- The timeout for the poll operation on the default event queue (e.g., 1000ms)
  eventQueueLongPollTimeout: ""
  # -- Whether to enable workflow/task definition name validation
  workflowNameValidationEnabled: false
  # -- Whether to enable summary input/output JSON serialization
  summaryInputOutputJsonSerializationEnabled: ""
  # -- The threshold of the workflow input payload size beyond which the payload will be stored in ExternalPayloadStorage (defaults to 5120KB;
  # without externalPayloadStorage.type, the payloads beyond the thresholds are stored in the pod, lost on restart and not shared
  # between replicas)
  workflowInputPayloadSizeThreshold: ""
  # -- The maximum threshold of the workflow input payload size beyond which input will be rejected and the workflow marked as FAILED (defaults to 10240KB)
  maxWorkflowInputPayloadSizeThreshold: ""
  # -- The threshold of the workflow output payload size beyond which the payload will be stored in ExternalPayloadStorage (defaults to 5120KB)
  workflowOutputPayloadSizeThreshold: ""
  # -- The maximum threshold of the workflow output payload size beyond which output will be rejected and the workflow marked as FAILED (defaults to 10240KB)
  maxWorkflowOutputPayloadSizeThreshold: ""
  # -- The threshold of the task input payload size beyond which the payload will be stored in ExternalPayloadStorage (defaults to 3072KB)
  taskInputPayloadSizeThreshold: ""
  # -- The maximum threshold of the task input payload size beyond which the task input will be rejected and the task marked as FAILED_WITH_TERMINAL_ERROR (defaults to 10240KB)
  maxTaskInputPayloadSizeThreshold: ""
  # -- The threshold of the task output payload size beyond which the payload will be stored in ExternalPayloadStorage (defaults to 3072KB)
  taskOutputPayloadSizeThreshold: ""
  # -- The maximum threshold of the task output payload size beyond which the task output will be rejected and the task marked as FAILED_WITH_TERMINAL_ERROR (defaults to 10240KB)
  maxTaskOutputPayloadSizeThreshold: ""
  # -- The maximum threshold of the workflow variables payload size beyond which the task changes will be rejected and the task marked as FAILED_WITH_TERMINAL_ERROR (defaults to 256KB)
  maxWorkflowVariablesPayloadSizeThreshold: ""
  # -- The maximum size of task execution logs
  taskExecLogSizeLimit: ""
  # -- Whether to enable the (deprecated) workflow repair service
  workflowRepairServiceEnabled: false

# -- Scheduler configuration
scheduler:
  # -- Enable the scheduler
  enabled: true

# -- Workflow archival configuration (an archive workflow status listener, which removes the completed workflows from the
# primary storage; combined with statusListener.workflowType, if set)
workflowArchival:
  # -- Enable workflow archival
  enabled: false
  # -- Archival type (DEFAULT keeps the workflows in the indexing backend only, S3 also uploads them to S3)
  type: DEFAULT
  # -- Time to keep the completed workflows before removing them (e.g., 30d; if set, it takes precedence over type)
  ttl: ""
  # -- Delay in seconds before archiving a completed workflow (defaults to 60)
  delaySeconds: ""
  # -- Archive only the workflows that did not complete successfully
  unsuccessfulOnly: false
  # -- Number of threads processing the delayed archivals
  delayQueueWorkerThreadCount: ""
  # -- S3 bucket name when type is S3
  s3BucketName: ""
  # -- S3 bucket region when type is S3 (defaults to us-east-1)
  s3BucketRegion: ""

# -- Workflow message queue configuration
workflowMessageQueue:
  # -- Enable the workflow message queue
  enabled: false
  # -- Maximum number of messages in the queue
  maxQueueSize: 1000
  # -- Message time-to-live in seconds
  ttlSeconds: 86400
  # -- Maximum messages processed in a batch
  maxBatchSize: 100

# -- DB configuration
db:
  # -- DB type (redis_standalone, redis_cluster, redis_sentinel, mysql, postgres, cassandra, sqlite; sqlite keeps the data in
  # the pod, lost on restart)
  type: redis_standalone

# -- Queue configuration
queue:
  # -- Queue type (redis_standalone, redis_cluster, redis_sentinel, or the db.type for postgres, mysql and sqlite, which use
  # their own queues; cassandra requires a Redis queue type)
  type: redis_standalone

# -- Default event queue configuration (the queues Conductor listens on for WAIT/HUMAN task updates; enabling it also
# enables the event queues of its type)
defaultEventQueue:
  # -- Enable default event queue
  enabled: false
  # -- Default event queue type (amqp, nats_stream, jsm, kafka)
  type: amqp

# -- Workflow execution lock configuration
workflowExecutionLock:
  # -- Workflow execution lock type (redis, postgres, sqlite, local_only, noop_lock; postgres and sqlite require the same db.type)
  type: redis

# -- Indexing configuration
indexing:
  # -- Enable indexing
  enabled: true
  # -- Indexing type (elasticsearch, elasticsearch8, opensearch2, opensearch3, postgres, sqlite; postgres and sqlite require the
  # same db.type, and elasticsearch8, opensearch2 and opensearch3 an image built with the INDEXING_BACKEND build argument, as
  # the conductoross/conductor image only includes Elasticsearch 7)
  type: elasticsearch

# -- External payload storage configuration
externalPayloadStorage:
  # -- External payload storage type (postgres, s3, azureblob, or empty for none; postgres uses the postgres.* connection)
  type: ""

# -- Redis configuration
redis:
  # -- Redis host
  host: ""
  # -- Redis port (with redis_sentinel, the port of the master, also allowed by networkPolicy.allowBackends)
  port: 6379
  # -- List of Redis hosts (host:port[:rack], separated by semicolons, the Sentinel nodes for redis_sentinel; the rack defaults
  # to availabilityZone, and the chart appends the password). Overrides host/port if set
  hosts: ""
  # -- Redis Sentinel master name
  masterName: ""
  # -- Password of the Redis Sentinel nodes themselves (when they require AUTH)
  sentinelPassword: ""
  # -- Redis ACL username
  username: ""
  # -- Enable SSL/TLS
  ssl: false
  # -- Redis password (must not contain ':' or ';', as Conductor reads it from the host list)
  password: ""
  # -- Task definition cache refresh interval in seconds
  taskDefCacheRefreshInterval: 1
  # -- Workflow namespace prefix
  workflowNamespacePrefix: conductor
  # -- Queue namespace prefix
  queueNamespacePrefix: conductor_queues
  # -- Availability zone/rack for the Redis node
  availabilityZone: us-east-1c
  # -- Maximum idle connections in the pool
  maxIdleConnections: ""
  # -- Minimum idle connections in the pool
  minIdleConnections: ""
  # -- Minimum time an idle connection can sit in the pool before eviction (ms)
  minEvictableIdleTimeMillis: ""
  # -- Time between eviction runs (ms, -1 to disable)
  timeBetweenEvictionRunsMillis: ""
  # -- Whether to validate connections while idle
  testWhileIdle: ""
  # -- Number of connections to test per eviction run
  numTestsPerEvictionRun: ""

# -- Redis lock configuration (used when workflowExecutionLock.type is redis)
redisLock:
  # -- Redis lock server type (single, cluster, sentinel; defaults to the type matching db.type)
  serverType: ""
  # -- Redis Sentinel master name for the lock (defaults to redis.masterName)
  serverMasterName: ""
  # -- Redis lock namespace/key prefix
  namespace: ""

# -- MySQL configuration
mySql:
  # -- MySQL host
  host: ""
  # -- MySQL port
  port: 3306
  # -- MySQL username
  username: ""
  # -- MySQL password
  password: ""
  # -- MySQL database name
  database: ""
  # -- Extra JDBC URL parameters (e.g., sslMode=REQUIRED&serverTimezone=UTC)
  urlParameters: ""
  # -- MySQL deadlock retry max attempts
  deadlockRetryMax: ""
  # -- Task definition cache refresh interval (e.g., 60s)
  taskDefCacheRefreshInterval: ""

# -- PostgreSQL configuration
postgres:
  # -- PostgreSQL host
  host: ""
  # -- PostgreSQL port
  port: 5432
  # -- PostgreSQL username
  username: ""
  # -- PostgreSQL password
  password: ""
  # -- PostgreSQL database name
  database: ""
  # -- Extra JDBC URL parameters (e.g., sslmode=require), also used for the external payload storage
  urlParameters: ""
  # -- PostgreSQL schema
  schema: ""
  # -- PostgreSQL deadlock retry max attempts
  deadlockRetryMax: ""
  # -- Task definition cache refresh interval (e.g., 60s)
  taskDefCacheRefreshInterval: ""
  # -- Maximum async indexing threads (Postgres persistence)
  asyncMaxPoolSize: ""
  # -- Async indexing task queue depth (Postgres persistence)
  asyncWorkerQueueSize: ""
  # -- Poll data flush interval in ms (e.g., 5000)
  pollDataFlushInterval: ""
  # -- Poll data cache validity period in ms (e.g., 5000)
  pollDataCacheValidityPeriod: ""
  # -- Only index workflow on status change
  onlyIndexOnStatusChange: ""
  # -- Enable LISTEN/NOTIFY based queues (experimental)
  experimentalQueueNotify: ""
  # -- LISTEN/NOTIFY stale period in ms (e.g., 5000)
  experimentalQueueNotifyStalePeriod: ""
  # -- External payload storage configuration for PostgreSQL
  externalPayloadStorage:
    # -- Conductor URL
    conductorUrl: ""
    # -- Table name
    tableName: external.external_payload
    # -- Max data rows (a string, as larger numbers lose precision in YAML)
    maxDataRows: "9223372036854775807"
    # -- Max data days
    maxDataDays: 0
    # -- Max data months
    maxDataMonths: 0
    # -- Max data years
    maxDataYears: 1

# -- Cassandra configuration
cassandra:
  # -- Cassandra contact points (comma-separated hostnames or IPs), rendered as conductor.cassandra.hostAddress
  contactPoints: ""
  # -- Cassandra port
  port: 9042
  # -- Cassandra keyspace
  keyspace: conductor
  # -- Cassandra username
  username: ""
  # -- Cassandra password
  password: ""

# -- AMQP (RabbitMQ) Event Queues configuration
amqpEventQueues:
  # -- Enable the AMQP event queues (for event handlers and EVENT tasks; also enabled by defaultEventQueue.type amqp)
  enabled: false
  # -- RabbitMQ server host(s)
  hosts: ""
  # -- RabbitMQ username
  username: ""
  # -- RabbitMQ password
  password: ""
  # -- RabbitMQ virtual host
  virtualHost: /
  # -- RabbitMQ port
  port: 5672
  # -- Whether to use NIO
  useNio: false
  # -- Batch size for message consumption
  batchSize: 1
  # -- Poll time duration (e.g., 100ms)
  pollTimeDuration: 100ms
  # -- Queue type (classic, quorum)
  queueType: classic
  # -- Whether to process messages sequentially
  sequentialMsgProcessing: true
  # -- Connection timeout in ms
  connectionTimeoutInMilliSecs: 180000
  # -- Network recovery interval in ms
  networkRecoveryIntervalInMilliSecs: 5000
  # -- Heartbeat timeout in seconds
  requestHeartbeatTimeoutInSecs: 30
  # -- Handshake timeout in ms
  handshakeTimeoutInMilliSecs: 180000
  # -- Maximum channel count
  maxChannelCount: 5000
  # -- Rate limit
  limit: 50
  # -- Rate limit duration in ms
  duration: 1000
  # -- Retry type (REGULARINTERVALS, EXPONENTIALBACKOFF, INCREMENTALINTERVALS)
  retryType: REGULARINTERVALS
  # -- Whether to use exchange (true) or queue (false)
  useExchange: true
  # -- Listener queue prefix
  listenerQueuePrefix: ""
  # -- Whether queues are durable
  durable: false
  # -- Whether queues are exclusive
  exclusive: false

# -- NATS Event Queues configuration
natsEventQueues:
  natsStream:
    # -- Enable the NATS Streaming event queues (also enabled by defaultEventQueue.type nats_stream)
    enabled: false
    # -- NATS streaming cluster ID
    clusterID: test-cluster
    # -- NATS streaming durable name
    durableName: ""
    # -- NATS streaming URL
    url: nats://localhost:4222
    # -- Listener queue prefix
    listenerQueuePrefix: ""
  jetStream:
    # -- Enable the NATS JetStream event queues (also enabled by defaultEventQueue.type jsm)
    enabled: false
    # -- NATS JetStream URL
    url: nats://localhost:4222
    # -- JetStream durable consumer name
    durableName: defaultQueue
    # -- JetStream stream storage type (file, memory)
    streamStorageType: file
    # -- JetStream stream replicas
    replicas: 3
    # -- Listener queue prefix
    listenerQueuePrefix: ""

# -- Kafka Event Queues configuration
kafkaEventQueues:
  # -- Enable the Kafka event queues (also enabled by defaultEventQueue.type kafka)
  enabled: false
  # -- Kafka bootstrap servers
  bootstrapServers: kafka:29092
  # -- Dead letter queue topic
  dlqTopic: conductor-dlq
  # -- Listener queue prefix
  listenerQueuePrefix: conductor_
  # -- Poll time duration (e.g., 500ms)
  pollTimeDuration: 500ms
  # -- Kafka consumer client properties
  consumer: { }
  # -- Kafka producer client properties
  producer: { }
  # -- Kafka admin client properties
  admin: { }

# -- Elasticsearch configuration
elasticsearch:
  # -- Elasticsearch URL
  url: ""
  # -- Elasticsearch username
  username: ""
  # -- Elasticsearch password
  password: ""
  # -- Elasticsearch index prefix
  indexPrefix: ""
  # -- Elasticsearch index replicas count (0 has no redundancy; the cluster health stays yellow on a single node otherwise)
  indexReplicasCount: 1
  # -- Elasticsearch primary shard count per index
  indexShardCount: 5
  # -- Documents per batch in async indexing mode
  indexBatchSize: 1
  # -- Async indexing task queue depth
  asyncWorkerQueueSize: 100
  # -- Maximum async indexing threads
  asyncMaxPoolSize: 12
  # -- Maximum time an async buffer is held before flushing (e.g., 10s)
  asyncBufferFlushTimeout: 10s
  # -- Elasticsearch version (7 with indexing.type elasticsearch; use indexing.type elasticsearch8 for Elasticsearch 8)
  version: 7
  # -- Elasticsearch cluster health color
  clusterHealthColor: yellow
  # -- REST client connection request timeout in ms (-1 means unlimited)
  restClientConnectionRequestTimeout: -1

# -- OpenSearch configuration
openSearch:
  # -- OpenSearch URL
  url: ""
  # -- OpenSearch username
  username: ""
  # -- OpenSearch password
  password: ""
  # -- OpenSearch index prefix
  indexPrefix: ""
  # -- OpenSearch primary shard count per index
  indexShardCount: 5
  # -- OpenSearch index replicas count (0 has no redundancy)
  indexReplicasCount: 0
  # -- OpenSearch cluster health color
  clusterHealthColor: green
  # -- Whether Conductor automatically manages indices
  autoIndexManagementEnabled: true
  # -- Documents per batch in async indexing mode
  indexBatchSize: 1
  # -- Async indexing task queue depth
  asyncWorkerQueueSize: 100
  # -- Maximum async indexing threads
  asyncMaxPoolSize: 12
  # -- Maximum time async buffer is held before flushing (e.g., 10s)
  asyncBufferFlushTimeout: 10s
  # -- Maximum task log entries returned per search
  taskLogResultLimit: 10
  # -- REST client connection request timeout in ms (-1 means unlimited)
  restClientConnectionRequestTimeout: -1

# -- Amazon S3 configuration
s3:
  # -- External payload storage configuration for Amazon S3
  externalPayloadStorage:
    # -- Bucket name where payloads will be stored
    bucketName: ""
    # -- Signed URL expiration duration in seconds
    signedUrlExpirationDuration: 5
    # -- AWS region of the bucket
    region: ""

# -- Azure Blob configuration
azureBlob:
  # -- External payload storage configuration for Azure Blob
  externalPayloadStorage:
    # -- Storage connection string (required to sign URLs)
    connectionString: ""
    # -- Storage endpoint (optional if connectionString is set)
    endpoint: ""
    # -- Storage SAS token (optional if connectionString is set)
    sasToken: ""
    # -- Storage container name
    containerName: conductor-payloads
    # -- Signed URL expiration in seconds
    signedUrlExpirationSeconds: 5
    # -- Path prefix for workflow input payloads
    workflowInputPath: workflow/input/
    # -- Path prefix for workflow output payloads
    workflowOutputPath: workflow/output/
    # -- Path prefix for task input payloads
    taskInputPath: task/input/
    # -- Path prefix for task output payloads
    taskOutputPath: task/output/

# -- Status listener configuration (webhook notifications)
statusListener:
  # -- Workflow status listener type (e.g., workflow_publisher)
  workflowType: ""
  # -- Task status listener type (e.g., task_publisher)
  taskType: ""

# -- Status notifier configuration
statusNotifier:
  # -- Webhook notification URL
  url: ""
  # -- Webhook endpoint for workflow status
  endpointWorkflow: ""
  # -- Webhook endpoint for task status
  endpointTask: ""
  # -- Subscribed task statuses (comma-separated, e.g., SCHEDULED,COMPLETED)
  subscribedTaskStatuses: ""
  # -- Subscribed workflow statuses (comma-separated, e.g., COMPLETED,FAILED)
  subscribedWorkflowStatuses: ""
  # -- Custom header name
  headerPrefer: ""
  # -- Custom header value
  headerPreferValue: ""
  # -- Connection timeout in ms
  requestTimeoutMsConnect: ""
  # -- Read timeout in ms
  requestTimeoutMsRead: ""
  # -- Connection manager timeout in ms
  requestTimeoutMsConnMgr: ""
  # -- Number of retries
  requestRetryCount: ""
  # -- Retry interval in ms
  requestRetryIntervalMs: ""
  # -- Max concurrent requests
  connectionPoolMaxRequest: ""
  # -- Max concurrent requests per route
  connectionPoolMaxRequestPerRoute: ""

# -- AI configuration
ai:
  # -- Enable the AI integrations (LLM tasks, MCP, agents)
  enabled: false
  # -- Outbound access for external MCP servers and Conductor-Agents OpenAPI discovery (default-deny)
  outbound:
    # -- Exact origins allowed for outbound access (comma-separated, e.g., https://tools.example.com)
    allowedOrigins: ""
    # -- Allow private network addresses for listed origins (development only)
    allowPrivateNetworks: false
  # -- Structured decision inference configuration
  decision:
    # -- Decision inference API key
    apiKey: ""
    # -- Decision inference provider (e.g., openrouter)
    provider: ""
    # -- Decision inference API shape (e.g., system-one)
    apiShape: ""
  # -- OpenAI configuration
  openAI:
    # -- OpenAI API key
    apiKey: ""
    # -- OpenAI organization ID
    organizationID: ""
  # -- Anthropic configuration
  anthropic:
    # -- Anthropic API key
    apiKey: ""
  # -- Mistral configuration
  mistral:
    # -- Mistral API key
    apiKey: ""
  # -- Cohere configuration
  cohere:
    # -- Cohere API key
    apiKey: ""
  # -- Grok configuration
  grok:
    # -- Grok API key
    apiKey: ""
  # -- Perplexity configuration
  perplexity:
    # -- Perplexity API key
    apiKey: ""
  # -- HuggingFace configuration
  huggingFace:
    # -- HuggingFace API key
    apiKey: ""
  # -- StabilityAI configuration
  stabilityAI:
    # -- StabilityAI API key
    apiKey: ""
  # -- Azure OpenAI configuration
  azureOpenAI:
    # -- Azure OpenAI API key
    apiKey: ""
    # -- Azure OpenAI base URL
    baseUrl: ""
    # -- Azure OpenAI deployment name
    deploymentName: ""
  # -- AWS Bedrock configuration
  bedrock:
    # -- AWS access key ID
    accessKey: ""
    # -- AWS secret access key
    secretKey: ""
    # -- AWS Bedrock bearer token
    bearerToken: ""
    # -- AWS region (defaults to the AWS_REGION environment variable, or us-east-1)
    region: ""
  # -- Google Gemini configuration
  gemini:
    # -- Google Gemini API key
    apiKey: ""
    # -- Google Cloud project ID
    projectID: ""
    # -- Google Cloud location (defaults to the GOOGLE_CLOUD_LOCATION environment variable, or us-central1)
    location: ""
    # -- Path to Google application credentials inside the container (e.g., mounted via extraVolumes)
    applicationCredentials: ""
    # -- Secret with the Google application credentials (a service account key), mounted for GOOGLE_APPLICATION_CREDENTIALS
    credentialsSecret:
      # -- Name of the Secret (takes precedence over applicationCredentials)
      name: ""
      # -- Key in the Secret that holds the credentials JSON (defaults to 'credentials.json')
      key: ""
  # -- Ollama configuration
  ollama:
    # -- Ollama base URL (defaults to the OLLAMA_BASE_URL or OLLAMA_HOST environment variable, or http://localhost:11434)
    baseUrl: ""

# -- Document access policy configuration
documentAccessPolicy:
  # -- Disable document access policy checks (not recommended for production)
  disabled: false
  # -- Additional directories allowed for local filesystem access (comma-separated)
  allowedDirectories: ""
  # -- Path prefixes added to the built-in blocklist (comma-separated)
  blockedPathPrefixes: ""
  # -- File names added to the built-in blocklist (comma-separated)
  blockedFileNames: ""
  # -- Hosts added to the built-in blocklist (comma-separated)
  blockedHosts: ""

# -- Metrics configuration
metrics:
  # -- Add the prometheus.io pod annotations for scraping /actuator/prometheus (requires prometheus in
  # management.endpointsWebExposureInclude)
  enabled: false
  # -- Enable metrics logging
  loggerEnabled: false

# -- Management configuration
management:
  # -- Enable Spring Boot's Redis health indicator (it checks spring.data.redis, not Conductor's Redis connection)
  healthRedisEnabled: false
  # -- Enable Spring Boot's Elasticsearch health indicator (it checks spring.elasticsearch, not Conductor's connection)
  healthElasticsearchEnabled: false
  # -- Actuator endpoints to expose (comma-separated; the image's nginx also serves them under /actuator on the UI port)
  endpointsWebExposureInclude: health,info,prometheus
  # -- Request metrics percentiles (comma-separated)
  metricsPercentiles: 0.50,0.75,0.90,0.95,0.99
  # -- Health endpoint detail level (never, when_authorized, always; always exposes backend details to anyone)
  healthShowDetails: when_authorized
  # -- Metrics export backends
  metricsExport:
    # -- Enable Atlas metrics export
    atlas: false
    # -- Enable OTLP metrics export
    otlp: false
    # -- Enable Influx metrics export
    influx: false
    # -- Enable Elastic metrics export
    elastic: false
    # -- Enable Dynatrace metrics export
    dynatrace: false
    # -- Enable New Relic metrics export
    newRelic: false
    # -- Enable Stackdriver metrics export
    stackdriver: false
    # -- Stackdriver Project ID
    stackdriverProjectID: ""
    # -- Enable Datadog metrics export
    datadog: false
    # -- Datadog API Key (stored in the Secret)
    datadogApiKey: ""
    # -- Enable StatsD metrics export
    statsD: false
    # -- Enable CloudWatch metrics export
    cloudWatch: false
    # -- CloudWatch Namespace
    cloudWatchNamespace: conductor
    # -- Enable Azure Monitor metrics export
    azureMonitor: false
    # -- Azure Monitor Instrumentation Key (stored in the Secret)
    azureMonitorInstrumentationKey: ""
    # -- Enable JMX metrics export
    jmx: false

# -- GRPC Server configuration
grpcServer:
  # -- Enable GRPC server (listen port is `container.ports.grpc`)
  enabled: false

# -- Spring configuration
spring:
  # -- Spring application name
  applicationName: conductor
  # -- Allow Spring bean definition overriding
  allowBeanDefinitionOverriding: true
  # -- Profiles passed via SPRING_PROFILES_ACTIVE (the image has none of its own; Conductor logs to the console)
  profilesActive: ""
  # -- Path to the API docs endpoint
  apiDocsPath: /api-docs

# -- Logging configuration
logging:
  level:
    # -- Root log level
    root: INFO

# -- Secrets
secrets:
  # -- When true (default), the chart creates its own Secret from values when no existingSecret is specified (when false,
  # create a Secret named like the release fullname with the same keys)
  manageSecret: true
  # -- Use an existing Secret for all credential keys instead of a chart-managed Secret (the Redis, MySQL and PostgreSQL
  # passwords are required keys when used; the others are optional)
  existingSecret:
    # -- Name of the existing Secret containing the credentials
    name: ""
    # -- Optional mapping to override the expected key names in the existing Secret
    keys:
      # -- Key name for Redis password (defaults to 'redis-password')
      redisPassword: ""
      # -- Key name for Redis Sentinel password (defaults to 'redis-sentinel-password')
      redisSentinelPassword: ""
      # -- Key name for Elasticsearch password (defaults to 'elasticsearch-password')
      elasticsearchPassword: ""
      # -- Key name for MySQL password (defaults to 'my-sql-password')
      mySqlPassword: ""
      # -- Key name for PostgreSQL password (defaults to 'postgres-password')
      postgresPassword: ""
      # -- Key name for OpenSearch password (defaults to 'open-search-password')
      openSearchPassword: ""
      # -- Key name for Cassandra password (defaults to 'cassandra-password')
      cassandraPassword: ""
      # -- Key name for Azure Blob connection string (defaults to 'azure-blob-connection-string')
      azureBlobConnectionString: ""
      # -- Key name for Azure Blob SAS token (defaults to 'azure-blob-sas-token')
      azureBlobSasToken: ""
      # -- Key name for AMQP password (defaults to 'amqp-password')
      amqpPassword: ""
      # -- Key name for decision inference API key (defaults to 'ai-decision-api-key')
      aiDecisionApiKey: ""
      # -- Key name for OpenAI API key (defaults to 'ai-open-ai-api-key')
      aiOpenAiApiKey: ""
      # -- Key name for Anthropic API key (defaults to 'ai-anthropic-api-key')
      aiAnthropicApiKey: ""
      # -- Key name for Mistral API key (defaults to 'ai-mistral-api-key')
      aiMistralApiKey: ""
      # -- Key name for Cohere API key (defaults to 'ai-cohere-api-key')
      aiCohereApiKey: ""
      # -- Key name for Grok API key (defaults to 'ai-grok-api-key')
      aiGrokApiKey: ""
      # -- Key name for Perplexity API key (defaults to 'ai-perplexity-api-key')
      aiPerplexityApiKey: ""
      # -- Key name for Hugging Face API key (defaults to 'ai-hugging-face-api-key')
      aiHuggingFaceApiKey: ""
      # -- Key name for Stability AI API key (defaults to 'ai-stability-ai-api-key')
      aiStabilityAiApiKey: ""
      # -- Key name for Azure OpenAI API key (defaults to 'ai-azure-open-ai-api-key')
      aiAzureOpenAiApiKey: ""
      # -- Key name for Bedrock access key (defaults to 'ai-bedrock-access-key')
      aiBedrockAccessKey: ""
      # -- Key name for Bedrock secret key (defaults to 'ai-bedrock-secret-key')
      aiBedrockSecretKey: ""
      # -- Key name for Bedrock bearer token (defaults to 'ai-bedrock-bearer-token')
      aiBedrockBearerToken: ""
      # -- Key name for Gemini API key (defaults to 'ai-gemini-api-key')
      aiGeminiApiKey: ""
      # -- Key name for Datadog API key (defaults to 'datadog-api-key')
      datadogApiKey: ""
      # -- Key name for Azure Monitor instrumentation key (defaults to 'azure-monitor-instrumentation-key')
      azureMonitorInstrumentationKey: ""

# -- Extra Conductor/Spring properties (e.g., conductor.app.foo: bar), added to (and overriding) the chart's properties (an
# empty value removes the property)
extraProperties: { }

# -- Environment variables (EXTRA_JVM_OPTS is appended to JAVA_OPTS; the names must be valid shell identifiers, as the
# image starts Java from a shell, so set the Conductor/Spring properties via extraProperties, which take precedence)
env:
  EXTRA_JVM_OPTS: ""
