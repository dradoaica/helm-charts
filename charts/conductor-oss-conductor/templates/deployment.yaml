apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "conductor-oss-conductor.fullname" . }}
  labels:
    {{- include "conductor-oss-conductor.labels" . | nindent 4 }}
  {{- with (include "conductor-oss-conductor.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.revisionHistoryLimit }}
  revisionHistoryLimit: {{ . }}
  {{- end }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if not .Values.autoscaling.create }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "conductor-oss-conductor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "conductor-oss-conductor.podLabels" . | nindent 8 }}
      annotations:
        kubectl.kubernetes.io/default-container: conductor
        checksum/config: {{ include (print $.Template.BasePath "/config-map.yaml") . | sha256sum }}
        # Rollout on secret reference changes
        creds/conductor-secret: {{ include "conductor-oss-conductor.secretName" . | quote }}
        {{- if include "conductor-oss-conductor.createSecret" . }}
        # Rollout on credential changes
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.container.ports.rest | quote }}
        prometheus.io/path: /actuator/prometheus
        {{- end }}
        {{- with (include "conductor-oss-conductor.podAnnotations" .) }}
        {{- . | nindent 8 }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      serviceAccountName: {{ include "conductor-oss-conductor.serviceAccountName" . }}
      # Conductor does not call the Kubernetes API
      automountServiceAccountToken: false
      # Spring Boot could bind the Service environment variables as properties
      enableServiceLinks: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.podSecurityContext.enabled }}
      securityContext:
        {{- toYaml (omit .Values.podSecurityContext "enabled") | nindent 8 }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName | quote }}
      {{- end }}
      initContainers:
        # The image's startup script also appends the console output to /app/logs/server.log, which nothing rotates
        - name: discard-log-file
          image: {{ include "conductor-oss-conductor.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.containerSecurityContext.enabled }}
          securityContext:
            {{- toYaml (omit .Values.containerSecurityContext "enabled") | nindent 12 }}
          {{- end }}
          command: [ "ln", "-sf", "/dev/null", "/app/logs/server.log" ]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: logs
              mountPath: /app/logs
        {{- with .Values.extraInitContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      containers:
        {{- if .Values.extraContainers }}
        {{- toYaml .Values.extraContainers | nindent 8 }}
        {{- end }}
        - name: conductor
          image: {{ include "conductor-oss-conductor.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.containerSecurityContext.enabled }}
          securityContext:
            {{- toYaml (omit .Values.containerSecurityContext "enabled") | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: JAVA_OPTS
              value: >-
                -server
                -XX:+AlwaysActAsServerClassMachine
                -XX:+UseContainerSupport
                -XX:+AlwaysPreTouch
                -XX:+UseG1GC
                -XX:G1HeapRegionSize={{ default 1 .Values.memory.g1HeapRegionSizeMB }}M
                -XX:MaxGCPauseMillis=200
                -XX:+ExplicitGCInvokesConcurrent
                -XX:+UseStringDeduplication
                -XX:+ParallelRefProcEnabled
                -XX:-OmitStackTraceInFastThrow
                -XX:+ExitOnOutOfMemoryError
                -XX:+HeapDumpOnOutOfMemoryError
                -XX:HeapDumpPath=/tmp/heapdump.hprof
                -XX:MaxMetaspaceSize={{ default 256 .Values.memory.maxMetaspaceSizeMB }}M
                -XX:ReservedCodeCacheSize={{ default 240 .Values.memory.reservedCodeCacheSizeMB }}M
                -XX:MaxDirectMemorySize={{ default 256 .Values.memory.maxDirectMemorySizeMB }}M
                -Xms{{ default 1536 .Values.memory.onHeapMB }}M
                -Xmx{{ default 1536 .Values.memory.onHeapMB }}M
                {{ .Values.env.EXTRA_JVM_OPTS }}
            # The image's startup script passes CONFIG_PROP (relative to /app/config) as -DCONDUCTOR_CONFIG_FILE;
            # Conductor also reads the CONDUCTOR_CONFIG_FILE environment variable
            - name: CONFIG_PROP
              value: chart/conductor.properties
            - name: CONDUCTOR_CONFIG_FILE
              value: /app/config/chart/conductor.properties
            {{- with .Values.spring.profilesActive }}
            - name: SPRING_PROFILES_ACTIVE
              value: {{ . | quote }}
            {{- end }}
            {{- range (include "conductor-oss-conductor.credentials" . | fromYamlArray) }}
            - name: {{ .env }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "conductor-oss-conductor.secretName" $ }}
                  key: {{ .secretKey }}
                  {{- if .optional }}
                  optional: true
                  {{- end }}
            {{- end }}
            {{- with (include "conductor-oss-conductor.geminiCredentialsPath" .) }}
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: {{ . | quote }}
            {{- end }}
            {{- range $name, $value := .Values.env }}
            {{- if ne $name "EXTRA_JVM_OPTS" }}
            - name: {{ $name | quote }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnvVars }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or .Values.extraEnvFrom .Values.extraEnvVarsCM .Values.extraEnvVarsSecret }}
          envFrom:
            {{- if .Values.extraEnvFrom }}
            {{- toYaml .Values.extraEnvFrom | nindent 12 }}
            {{- end }}
            {{- if .Values.extraEnvVarsCM }}
            - configMapRef:
                name: {{ .Values.extraEnvVarsCM }}
            {{- end }}
            {{- if .Values.extraEnvVarsSecret }}
            - secretRef:
                name: {{ .Values.extraEnvVarsSecret }}
            {{- end }}
          {{- end }}
          ports:
            - name: ui
              containerPort: {{ .Values.container.ports.ui }}
              protocol: TCP
            - name: rest
              containerPort: {{ .Values.container.ports.rest }}
              protocol: TCP
            {{- if .Values.grpcServer.enabled }}
            - name: grpc
              containerPort: {{ .Values.container.ports.grpc }}
              protocol: TCP
            {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe: {{- include "common.tplvalues.render" (dict "value" (omit .Values.startupProbe "enabled") "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe: {{- include "common.tplvalues.render" (dict "value" (omit .Values.livenessProbe "enabled") "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe: {{- include "common.tplvalues.render" (dict "value" (omit .Values.readinessProbe "enabled") "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.lifecycleHooks }}
          lifecycle: {{- include "common.tplvalues.render" (dict "value" .Values.lifecycleHooks "context" $) | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /app/config/chart
              readOnly: true
            # Writable directories (the root filesystem may be read-only): heap dumps, server logs, nginx (serving the UI)
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /app/logs
            - name: nginx
              mountPath: /var/lib/nginx
            - name: nginx-logs
              mountPath: /var/log/nginx
            - name: run
              mountPath: /run
            {{- if and .Values.ai.enabled .Values.ai.gemini.credentialsSecret.name }}
            - name: gemini-credentials
              mountPath: /var/run/secrets/gemini
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "conductor-oss-conductor.fullname" . }}
        - name: tmp
          emptyDir: { }
        - name: logs
          emptyDir: { }
        - name: nginx
          emptyDir: { }
        - name: nginx-logs
          emptyDir: { }
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        {{- if and .Values.ai.enabled .Values.ai.gemini.credentialsSecret.name }}
        - name: gemini-credentials
          secret:
            secretName: {{ .Values.ai.gemini.credentialsSecret.name }}
            items:
              - key: {{ .Values.ai.gemini.credentialsSecret.key | default "credentials.json" }}
                path: credentials.json
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      restartPolicy: Always
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
      {{- end }}
