{{- if .Values.networkPolicy.create }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.networkPolicy.name | default (include "conductor-oss-conductor.fullname" .) }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "conductor-oss-conductor.labels" . | nindent 4 }}
  {{- with (include "conductor-oss-conductor.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  egress:
    {{- $backendPorts := include "conductor-oss-conductor.backendPorts" . | fromYamlArray }}
    {{- if and .Values.networkPolicy.allowBackends $backendPorts }}
    # Allow traffic to the configured backends (Redis, the database, the indexing backend, the event queues)
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }
        - namespaceSelector: { }
      ports:
        {{- range $backendPorts }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    {{- end }}
    {{- with .Values.networkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  ingress:
    {{- if .Values.networkPolicy.allowTests }}
    # Allow traffic from the chart's test pods (helm test)
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "conductor-oss-conductor.name" . }}-test
              app.kubernetes.io/instance: {{ .Release.Name }}
    {{- end }}
    {{- with .Values.networkPolicy.ingress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  podSelector:
    matchLabels: {{- include "conductor-oss-conductor.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
{{- end }}
