{{- if include "conductor-oss-conductor.createSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "conductor-oss-conductor.fullname" . }}
  labels:
    {{- include "conductor-oss-conductor.labels" . | nindent 4 }}
  {{- with (include "conductor-oss-conductor.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{- range (include "conductor-oss-conductor.credentials" . | fromYamlArray) }}
  {{ .key }}: {{ .value | b64enc | quote }}
  {{- end }}
{{- end }}
